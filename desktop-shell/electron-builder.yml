appId: com.researchdirector.desktop
productName: Daftar
copyright: Copyright © 2026
directories:
  output: release
files:
  - dist/**
  - models.catalog.json
  - package.json
extraResources:
  - from: native
    to: native
    filter:
      - 'atlas-core*'
      - 'build.json'
  - from: ../company
    to: company
    filter:
      - 'engineering-intelligence-atlas.json'
      - 'team.json'
      - 'roadmap.json'
      - 'skill-briefs.json'
      - 'prompts/**'
      - 'role-library/**'
      - 'company-kits/**'
      - 'portfolio-presets.json'
  - from: resources/atlas
    to: atlas
    filter:
      - '**/*'
# No code signing, no auto-publish, no store metadata: debug/dev packages only.
publish: null
linux:
  target:
    - AppImage
    - dir
  category: Utility
  executableName: research-director-desktop-shell
  artifactName: daftar-desktop-${version}-${arch}.${ext}
win:
  executableName: Daftar
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: daftar-desktop-${version}-windows-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
# Windows is unsigned unless signing is configured by the release owner.
# Windows packaging must run on a Windows host; macOS (dmg/zip) on macOS.
