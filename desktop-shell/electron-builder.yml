appId: com.researchdirector.desktop
productName: Research Director Desktop
copyright: Copyright © 2026
directories:
  output: release
files:
  - dist/**
  - models.catalog.json
  - package.json
extraResources:
  - from: native
    to: native
    filter:
      - 'atlas-core*'
      - 'build.json'
  - from: ../company
    to: company
    filter:
      - 'engineering-intelligence-atlas.json'
      - 'team.json'
      - 'roadmap.json'
      - 'skill-briefs.json'
      - 'prompts/**'
      - 'role-library/**'
      - 'portfolio-presets.json'
  - from: resources/atlas
    to: atlas
    filter:
      - '**/*'
# No code signing, no auto-publish, no store metadata: debug/dev packages only.
publish: null
linux:
  target:
    - AppImage
    - dir
  category: Utility
  artifactName: research-director-desktop-${version}-${arch}.${ext}
# Windows (nsis/zip) and macOS (dmg/zip) packaging must be run on their
# respective host OSes; see README.md "Packaging".
