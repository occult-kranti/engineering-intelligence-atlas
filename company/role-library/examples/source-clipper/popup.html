<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Selected source</title></head>
<body>
  <h1>Selected source</h1>
  <p>Select up to 2,000 characters on the current page, then capture. Form fields and editable areas are excluded. Nothing is uploaded.</p>
  <button id="capture" type="button">Capture selection</button>
  <p id="status" role="status">No page has been captured.</p>
  <label for="preview">Review this local record before exporting</label>
  <textarea id="preview" rows="14" cols="45" readonly></textarea>
  <button id="export" type="button" disabled>Export reviewed JSON</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
