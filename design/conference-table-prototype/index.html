<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daftar — Infinite Blueprint Studio</title>
<meta name="description" content="A spatial office prototype: companies, teams, boards and Donna on one endless conference table.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#071b17;--bg2:#0b2621;--line:#e9e2cf;--dim:rgba(233,226,207,.38);--faint:rgba(233,226,207,.12);--gold:#d4a853;--paper:#f1e6c4;--ink:#1a1a14;--ui:#0a211cee;--ui2:#103029;--txt:#efe9d6;--act:#4fd6a0;--load:#e8b84a;--wait:#6fb4e8;--blk:#e5604f;--room:rgba(233,226,207,.035)}
body[data-theme=cobalt]{--bg:#0a1730;--bg2:#10213f;--line:#dce6f7;--dim:rgba(220,230,247,.4);--faint:rgba(220,230,247,.12);--gold:#f0b95a;--paper:#f3e9c9;--ui:#0c1b36ee;--ui2:#142a4d;--txt:#e6eefc;--room:rgba(220,230,247,.04)}
body[data-theme=ivory]{--bg:#ece5d2;--bg2:#e2dac3;--line:#2b2a24;--dim:rgba(43,42,36,.5);--faint:rgba(43,42,36,.14);--gold:#9a6b14;--paper:#fbf1c9;--ui:#f7f1dfee;--ui2:#e8dfc6;--txt:#24231d;--room:rgba(43,42,36,.04);--act:#1e9a6a;--load:#b8860b;--wait:#2f7fc0;--blk:#c4412f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg) 70%)}
#viewport.panning{cursor:grabbing}
#viewport.tilt{perspective:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:auto}
#tiltwrap{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .25s ease}
.tilt #tiltwrap{transform:skewX(-5deg) scaleY(.94)}
#grid{position:absolute;left:-4000px;top:-3000px;width:9000px;height:7000px;background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:50px 50px;opacity:.5;pointer-events:none}
.bp{position:absolute;pointer-events:none}
.bp svg{overflow:visible;display:block}
.bp .hit{pointer-events:all}
.room{fill:var(--room);stroke:none;cursor:pointer;pointer-events:all;transition:fill .2s}
.room:hover,.room.sel{fill:rgba(212,168,83,.14)}
.wall{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:square}
.thin{fill:none;stroke:var(--line);stroke-width:1.4}
.dimln{fill:none;stroke:var(--dim);stroke-width:1;stroke-dasharray:4 4}
.lbl{fill:var(--line);font:600 13px "Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.lbl2{fill:var(--dim);font:500 10px "Segoe UI",sans-serif;pointer-events:none}
.emp{cursor:pointer;pointer-events:all}
.emp .body{fill:var(--bg2);stroke:var(--line);stroke-width:1.6}
.emp:hover .body,.emp.sel .body{stroke:var(--gold);stroke-width:2.6}
.emp text{fill:var(--line);font:600 10.5px "Segoe UI",sans-serif;pointer-events:none}
.emp .st{font:500 9px "Segoe UI",sans-serif;fill:var(--dim)}
.halo{fill:none;stroke-width:2.5;opacity:.9}
.halo.active{stroke:var(--act);animation:pulse 2.4s ease-in-out infinite}
.halo.loaded{stroke:var(--load)}.halo.waiting{stroke:var(--wait)}.halo.blocked{stroke:var(--blk)}
@keyframes pulse{50%{opacity:.35;stroke-width:5}}
.heat .room{fill-opacity:1}
.seat{cursor:pointer;pointer-events:all}
.seat rect{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}
.seat:hover rect,.seat.sel rect{stroke:var(--gold);stroke-width:2.5}
.seat text{fill:var(--line);font:600 12px "Segoe UI";pointer-events:none}
.obj{position:absolute;pointer-events:auto;border-radius:6px}
.obj .handle{height:24px;display:flex;align-items:center;gap:6px;padding:0 8px;cursor:move;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:6px 6px 0 0;user-select:none}
.board{background:var(--paper);color:var(--ink);box-shadow:0 14px 30px rgba(0,0,0,.4);border:6px solid #6b5a3a}
body[data-theme=ivory] .board{border-color:#8a7650}
.board .handle{background:#6b5a3a;color:#f1e6c4;margin:-6px -6px 0;padding:0 14px}
.board .bd{padding:10px;position:relative}
.sticky{position:absolute;width:150px;min-height:92px;padding:8px;box-shadow:0 6px 12px rgba(0,0,0,.35);color:#222;font:500 12.5px/1.35 "Segoe Print","Bradley Hand",cursive;border-radius:2px}
.sticky .sh{height:12px;cursor:move;margin:-8px -8px 4px;background:rgba(0,0,0,.08)}
.sticky .tx{outline:none;min-height:56px;white-space:pre-wrap;word-break:break-word}
.sticky .sc{display:flex;gap:4px;margin-top:4px}
.sticky .sc i,.sticky .sc button{width:12px;height:12px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.3);cursor:pointer}
.sticky .del{position:absolute;right:3px;top:-1px;border:0;background:none;font-size:14px;cursor:pointer;color:#333}
.task{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.2);font-size:12.5px}
.task.done span.t{text-decoration:line-through;opacity:.55}
.task span.t{flex:1}
.mini{border:1px solid #6b5a3a;background:rgba(255,255,255,.5);border-radius:3px;font-size:11px;padding:1px 6px;color:#2a2418}
.mini:hover{background:#fff}
.dark{background:var(--ui);border:1px solid var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.45);color:var(--txt)}
.dark .handle{background:var(--ui2);color:var(--gold)}
.bar{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--ui);border:1px solid var(--faint);border-radius:10px;backdrop-filter:blur(8px)}
.bar .brand{font-weight:700;letter-spacing:.3em;color:var(--gold);margin:0 8px 0 4px}
.btn{background:transparent;border:1px solid var(--faint);border-radius:6px;padding:4px 9px;color:var(--txt)}
.btn:hover{border-color:var(--gold);background:rgba(212,168,83,.1)}
.btn.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px dashed var(--gold);color:var(--gold);border-radius:20px}
.tray{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;background:var(--ui);border:1px solid var(--faint);border-radius:12px;backdrop-filter:blur(8px)}
.tray .btn{border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px 9px;min-width:54px}
.tray svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.sep{width:1px;background:var(--faint);margin:2px 3px}
#minimap{position:fixed;left:12px;bottom:12px;width:190px;height:120px;z-index:20;background:var(--ui);border:1px solid var(--faint);border-radius:8px;overflow:hidden;cursor:pointer}
#minimap .mv{position:absolute;border:1.5px solid var(--gold);background:rgba(212,168,83,.12);pointer-events:none}
#minimap .md{position:absolute;background:var(--dim);pointer-events:none;border-radius:1px}
.legend{position:fixed;left:12px;bottom:142px;z-index:20;padding:8px 10px;background:var(--ui);border:1px solid var(--faint);border-radius:8px;display:none;font-size:11px}
.legend.show{display:block}
.legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
.legend i{width:11px;height:11px;border-radius:50%;border:2px solid}
.win{position:fixed;z-index:40;border-radius:10px;overflow:hidden}
.win .handle{height:30px;display:flex;align-items:center;padding:0 8px 0 12px;cursor:move;user-select:none;background:var(--ui2);color:var(--gold);font-weight:600;letter-spacing:.04em}
.win .handle .x{margin-left:auto;background:none;border:0;font-size:16px;padding:0 6px}
.win .wb{padding:12px;max-height:60vh;overflow:auto}
.field{display:block;margin-bottom:9px;font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select{display:block;width:100%;margin-top:3px;padding:6px 8px;background:var(--bg);border:1px solid var(--faint);border-radius:5px;color:var(--txt);font:inherit;text-transform:none;letter-spacing:0}
.err{color:var(--blk);font-size:11px;min-height:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:12px;font-size:10.5px;border:1px solid}
.pill.active{color:var(--act)}.pill.loaded{color:var(--load)}.pill.waiting{color:var(--wait)}.pill.blocked{color:var(--blk)}
#donna{position:fixed;right:16px;bottom:16px;z-index:30;width:320px}
#donna .av{position:absolute;right:0;bottom:0;width:54px;height:54px;border-radius:50%;background:var(--ui2);border:2px solid var(--gold);display:grid;place-items:center;cursor:pointer;z-index:2}
#donna .chat{margin-bottom:64px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;height:340px}
#donna.col .chat{display:none}
.msgs{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.m{padding:6px 9px;border-radius:8px;max-width:92%;font-size:12.5px}
.m.u{align-self:flex-end;background:var(--gold);color:#1a1405}
.m.d{background:var(--ui2)}
.m small{display:block;color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.chat form{display:flex;gap:4px;padding:6px;border-top:1px solid var(--faint)}
.chat input,.chat select{background:var(--bg);color:var(--txt);border:1px solid var(--faint);border-radius:5px;padding:5px;font:inherit}
.chat input{flex:1;min-width:0}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:60;background:var(--ui);border:1px solid var(--gold);padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:420px}
#toast.show{opacity:1}
#search{position:fixed;left:50%;top:18%;transform:translateX(-50%);width:420px;z-index:70}
#search ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
#search li{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between}
#search li.on,#search li:hover{background:rgba(212,168,83,.18)}
#search li span{color:var(--dim);font-size:11px}
table.rt{border-collapse:collapse;width:100%}table.rt td,table.rt th{border-bottom:1px solid var(--faint);padding:5px 6px;text-align:center;font-size:12px}table.rt td:first-child,table.rt th:first-child{text-align:left}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Refinement: one architectural table, readable tools, tactile papers. */
:root{--dim:rgba(233,226,207,.67);--faint:rgba(233,226,207,.15)}
body[data-theme=cobalt]{--dim:rgba(220,230,247,.7)}
body[data-theme=ivory]{--dim:rgba(43,42,36,.72)}
html,body{font-size:14px}
#viewport{background:radial-gradient(ellipse at 40% 35%,#13372d,var(--bg) 75%)}
body[data-theme=cobalt] #viewport{background:radial-gradient(ellipse at 40% 35%,#17385b,var(--bg) 75%)}
body[data-theme=ivory] #viewport{background:radial-gradient(ellipse at 40% 35%,#f3f0e6,var(--bg) 75%)}
#table-surface{position:absolute;left:-6000px;top:-420px;width:16000px;height:1160px;pointer-events:none;border:5px double #77643c;border-radius:100px;background:repeating-linear-gradient(0deg,transparent 0,transparent 7px,rgba(255,255,255,.013) 8px),linear-gradient(180deg,var(--bg2),var(--bg));box-shadow:0 20px 0 #171c16,0 25px 0 #665231,0 65px 70px #0008}
#grid{opacity:.22;background-size:32px 32px}
.bp{isolation:isolate}.bp:before{content:"";position:absolute;inset:-65px -22px -12px;border:1px solid var(--dim);border-radius:2px;background:linear-gradient(125deg,var(--bg2),var(--bg));box-shadow:0 16px 35px #0007,4px 4px 0 #0005;z-index:-1;pointer-events:none}
.bp svg{filter:drop-shadow(0 3px 2px #0002)}
.wall{stroke-width:3.5}.thin{stroke-width:1.25}.lbl{font-size:15px;letter-spacing:.09em}.lbl2{font-size:11px}.emp text{font-size:12px}.emp .st{font-size:10.5px;letter-spacing:.06em}.emp[data-kind=donna] .st{display:none}
.seat text{font-size:14px}.halo{stroke-width:2}.halo.active{animation-duration:3.8s}
.bar{left:14px;right:14px;top:12px;transform:none;justify-content:center;gap:6px;min-height:52px;padding:8px 12px;border:1px solid var(--dim);box-shadow:0 6px 22px #0003;background:var(--ui);white-space:nowrap;backdrop-filter:blur(12px)}
.bar .brand{font-family:Georgia,serif;font-size:23px;letter-spacing:.2em;margin-right:auto;color:var(--txt)}
.bar .badge{margin-left:auto;font-size:11px;letter-spacing:.05em;border-style:solid;border-radius:4px;padding:5px 9px;white-space:nowrap}
.bar .btn{font-size:13px;min-height:32px;padding:4px 9px}.btn{transition:background .18s,border-color .18s,box-shadow .18s}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.65;cursor:default}.btn:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.tray{bottom:14px;gap:3px;padding:8px 10px;border:1px solid var(--dim);box-shadow:0 9px 30px #0004}.tray .btn{font-size:12px;padding:5px 8px;min-width:55px;min-height:48px}.tray svg{width:21px;height:21px}.tray [data-t=company]{color:var(--gold)}
.board{border-width:5px;border-radius:3px;box-shadow:0 13px 0 #0002,0 22px 30px #0004;background:linear-gradient(105deg,#f5eccf,var(--paper))}.board .handle{height:31px;font-size:12px;font-weight:600;letter-spacing:.07em}.board .bd{padding:13px}.task{align-items:flex-start;gap:6px;font-size:14px;padding:8px 0;line-height:1.4}.task span.t{min-width:75px;overflow-wrap:anywhere}.mini{font-size:12px;padding:3px 6px;min-height:25px}.sticky{font:500 15px/1.4 "Segoe Print","Bradley Hand",cursive;padding:10px;transform:rotate(-1.2deg)}.sticky:nth-of-type(2n){transform:rotate(1deg)}.sticky .sh{height:17px}.sticky .sc{gap:6px;padding-top:6px}.sticky .sc>*{min-width:18px;min-height:18px}.sticky .del{min-width:23px;min-height:23px}.sticky .tx{min-height:55px}
.win{box-shadow:0 20px 60px #0007;max-width:calc(100vw - 24px);border-color:var(--dim)}.win .handle{height:40px;font-size:14px}.win .handle .x{font-size:21px;min-width:30px;min-height:30px}.win .wb{padding:18px;max-height:calc(100vh - 180px);font-size:14px}.field{font-size:13px;color:var(--txt);margin-bottom:15px}.field input,.field select{font-family:inherit;font-size:16px;min-height:39px}.err{font-size:13px}.pill{font-size:12px}.win .task{font-size:14px}.win .btn{font-size:14px;padding:7px 10px}
#minimap{width:190px;height:120px;border-color:var(--dim);background:var(--ui);box-shadow:0 5px 25px #0003}.legend{font-size:13px;bottom:148px}.legend div{margin:5px 0}
#donna{width:356px;right:18px;bottom:18px}#donna .av{width:58px;height:58px;box-shadow:0 4px 0 #0002,0 8px 24px #0006;background:linear-gradient(130deg,var(--ui2),var(--bg));border-width:1px}#donna .chat{height:425px;margin-bottom:72px;box-shadow:0 20px 60px #0006;border-color:var(--dim)}#chandle{min-height:42px;padding:12px;font-size:15px}.msgs{padding:13px;gap:10px}.m{font-size:14px;line-height:1.55;padding:10px 12px}.m small{font-size:11px;margin-bottom:3px}.chat form{flex-wrap:wrap;padding:10px;gap:7px}.chat select{width:100%;font-size:13px}.chat input{font-size:15px;padding:9px}.suggestions{display:flex;gap:5px;padding:8px 10px 0}.suggestions .btn{font-size:12px;padding:5px 8px}.draft-pin{display:block;margin-top:10px;font-size:13px}.chat .badge{font-size:10px}
#search{border-radius:8px;overflow:hidden;box-shadow:0 24px 70px #0008;max-width:calc(100vw - 30px)}#search li{padding:11px 14px}#search input{font-size:16px!important}#search li span{font-size:12px}#toast{font-size:14px;top:78px;max-width:calc(100vw - 30px)}
@media(max-width:1200px){.bar{gap:3px;padding:7px}.bar .brand{font-size:20px}.bar .btn{font-size:12px;padding:4px 6px}.bar .badge{font-size:10px;padding:4px}.tray .btn{font-size:11px;padding:4px 6px}.tray{gap:1px}}
@media(max-width:980px){.bar{flex-wrap:wrap;justify-content:flex-start}.bar .brand{margin-right:8px}.bar .badge{margin-left:0}.tray{max-width:calc(100vw - 24px);overflow-x:auto;left:12px;transform:none;justify-content:flex-start}.tray .btn{flex-shrink:0}.tray .sep{flex-shrink:0}#minimap{bottom:92px}#donna{bottom:90px;width:min(356px,calc(100vw - 32px))}.legend{bottom:220px}.win .wb{max-height:calc(100vh - 200px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* Keep the drafting grid viewport-sized instead of painting a giant world bitmap. */
#grid{display:none}
#viewport::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:32px 32px;opacity:.24}
#table-surface{left:-1900px;width:5600px;box-shadow:0 20px 0 #171c16,0 25px 0 #665231}
.bp svg{filter:none}
.sticky .sh{font:700 10px/17px system-ui;letter-spacing:.09em;text-transform:uppercase;padding-left:6px;height:18px;margin-bottom:8px}.note-check{display:flex;align-items:center;gap:4px;font:12px system-ui;margin-top:5px}.note-check input{width:16px;height:16px}.note-done .tx{text-decoration:line-through;opacity:.65}.tilt .bp:before{box-shadow:7px 10px 0 #0003,0 18px 20px #0003}#table-surface{left:0;width:100%;border-radius:0;pointer-events:none}#world{z-index:1}/* Stable paint path: motion is reserved for deliberate interactions. */
.bar,.tray{backdrop-filter:none}.halo.active{animation:none;stroke-width:3}.bp svg{filter:none}
</style>
</head>
<body data-theme="emerald">
<div id="viewport"><div id="table-surface" aria-hidden="true"></div><div id="world"><div id="tiltwrap"><div id="grid"></div><div id="scene"></div><div id="boards"></div></div></div></div>

<div class="bar" role="toolbar" aria-label="Utility">
<span class="brand">DAFTAR</span>
<button class="btn" id="bSearch" title="Search (Ctrl/Cmd+K)">Search ⌘K</button>
<button class="btn" id="bHome" title="Home (H)">Home</button>
<button class="btn" id="bFit" title="Fit all (F)">Fit</button>
<button class="btn" id="bZm" title="Zoom out (-)">−</button>
<button class="btn" id="bZp" title="Zoom in (+)">+</button>
<span id="zl" style="min-width:38px;text-align:center;color:var(--dim)">100%</span>
<button class="btn" id="bTilt" title="Toggle 2.5D presentation (T)" aria-pressed="false">Tilt</button>
<button class="btn" id="bHeat" title="Heatmap (M)" aria-pressed="false">Heatmap</button>

<button class="btn" id="bUndo" title="Undo last create/move">Undo</button>
<button class="btn" id="bHelp" title="Help (?)">?</button>

</div>

<div class="legend" id="legend"><b style="font-size:10px;letter-spacing:.1em;color:var(--gold)">LOAD · DEMO DATA</b>
<div><i style="border-color:var(--act)"></i>Active</div><div><i style="border-color:var(--load)"></i>Loaded</div><div><i style="border-color:var(--wait)"></i>Waiting</div><div><i style="border-color:var(--blk)"></i>Blocked</div></div>

<div class="tray" role="toolbar" aria-label="Tools">

<button class="btn" data-t="hire" title="Hire an employee"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>Hire</button>
<button class="btn" data-t="dept" title="Add department"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 12h18M12 3v9"/></svg>Department</button>

 if(!r.companies.every(c=>str(c.name)&&num(c.x)&&num(c.y)&&(!c.parent||cs.has(c.parent))&&['hq','sm'].includes(c.kind)))return false;
 for(const c of r.companies){const seen=new Set();let p=c;while(p){if(seen.has(p.id))return false;seen.add(p.id);p=p.parent?cs.get(p.parent):null}}
 if(!r.depts.every(d=>cs.has(d.co)&&str(d.name)&&str(d.no)&&['rx','ry','w','h'].every(k=>num(d[k]))&&d.w>0&&d.h>0))return false;

 if(!r.tasks.every(t=>str(t.text)&&typeof t.done==='boolean'&&(!t.owner||t.owner==='you'||es.has(t.owner))))return false;
 if(!r.stickies.every(s=>str(s.text)&&num(s.x)&&num(s.y)&&Number.isInteger(s.c)&&s.c>=0&&s.c<COL.length))return false;
 if(!r.objs||!['white','soft','road','spend'].every(k=>r.objs[k]&&['x','y','w'].every(n=>num(r.objs[k][n]))&&r.objs[k].w>0))return false;

for(const r in S.roles){const tr=h('tr');tr.appendChild(h('td',{},r));S.roles[r].forEach((v,i)=>{const td=h('td'),cb=h('input',{type:'checkbox','aria-label':r+' '+cols[i]});cb.checked=!!v;cb.onchange=()=>{S.roles[r][i]=cb.checked?1:0;save()};td.appendChild(cb);tr.appendChild(td)});t.appendChild(tr)}
b.appendChild(t)},200,100,420)}
function budgetWin(){
openWin('budget','Budget & activity — sample',b=>{
const g=el('svg',{width:340,height:140,viewBox:'0 0 340 140'});
[20,35,30,55,48,70,62,90,75,60,85,100].forEach((n,i)=>{el('rect',{x:8+i*27,y:130-n,width:20,height:n,fill:'var(--gold)',opacity:.8},g)});
b.appendChild(g);b.appendChild(h('div',{style:'font-size:11px;color:var(--dim)'},'Sample units only. No real spend or billing. Billing: Not connected.'))},220,120,380)}
function helpWin(){
openWin('help','Help',b=>{
['Drag blank canvas: pan','Wheel: zoom at cursor (5–150%)','Arrows / WASD: pan · + / −: zoom','H home · F fit · T tilt · M heatmap · N sticky','Ctrl/Cmd+K: search · Esc: close top window','Drag ⠿ handles in top-down view to move boards and stickies','Expand into annex: relocate and enlarge a room without overlap','Focus a board or note handle, then use arrow keys to move','Undo reverts last create/move','Hotkeys are off while typing'].forEach(t=>b.appendChild(h('div',{style:'padding:2px 0'},t)))},240,100,360)}
function searchWin(){
closeWin('search',true);if($('#search'))return;
const prev=document.activeElement,box=h('div',{id:'search',class:'dark',role:'dialog','aria-label':'Search'});box._prev=prev;
box._restore=focusToken(prev);box.style.maxWidth='calc(100vw - 24px)';
const inp=h('input',{placeholder:'Search people, companies, rooms, boards…','aria-label':'Search'});inp.style.cssText='width:100%;padding:10px 12px;background:var(--bg);color:var(--txt);border:0;border-bottom:1px solid var(--faint);font:inherit';
const ul=h('ul'),items=[];
S.emps.forEach(e=>items.push({n:e.name,t:'person · '+e.role,f:()=>{const d=byId(S.depts,e.d),c=byId(S.companies,d.co);focusOn(c.x+d.rx+d.w/2,c.y+d.ry+d.h/2,.9);sel={k:'emp',id:e.id};renderScene()}}));
S.companies.forEach(c=>items.push({n:c.name,t:'company',f:()=>{const s=coSize(c);focusOn(c.x+s.w/2,c.y+s.h/2,.8);sel={k:'co',id:c.id};renderScene()}}));
S.depts.forEach(d=>items.push({n:d.name,t:'room · '+byId(S.companies,d.co).name,f:()=>{const c=byId(S.companies,d.co);focusOn(c.x+d.rx+d.w/2,c.y+d.ry+d.h/2,.9);sel={k:'dept',id:d.id};renderScene()}}));
[['white','Whiteboard'],['soft','Softboard'],['road','Roadmap'],['spend','Spend / Activity']].forEach(b=>items.push({n:b[1],t:'board',f:()=>focusBoard(b[0])}));
let cur=[],idx=0;
const draw=()=>{ul.innerHTML='';const q=inp.value.trim().toLowerCase();cur=items.filter(i=>!q||(i.n+' '+i.t).toLowerCase().includes(q)).slice(0,30);idx=Math.min(idx,Math.max(0,cur.length-1));
cur.forEach((i,k)=>{const li=h('li',{class:k==idx?'on':''});li.appendChild(h('b',{},i.n));li.appendChild(h('span',{},i.t));li.onclick=()=>go(i);ul.appendChild(li)});if(!cur.length)ul.appendChild(h('li',{},'No results'))};
const go=i=>{closeSearch();i.f()};
inp.oninput=()=>{idx=0;draw()};
inp.onkeydown=e=>{if(e.key=='ArrowDown'){e.preventDefault();idx=Math.min(cur.length-1,idx+1);draw()}else if(e.key=='ArrowUp'){e.preventDefault();idx=Math.max(0,idx-1);draw()}else if(e.key=='Enter'&&cur[idx]){e.preventDefault();go(cur[idx])}};
const close=h('button',{class:'btn','aria-label':'Close search',style:'display:block;margin:6px 8px 6px auto'},'Close');close.onclick=closeSearch;
box.appendChild(inp);box.appendChild(ul);box.appendChild(close);document.body.appendChild(box);draw();inp.focus()}
function closeSearch(){const b=$('#search');if(!b)return;const p=b._prev,token=b._restore;b.remove();restoreFocus(p,token)}
function focusBoard(k){const o=S.objs[k];focusOn(o.x+o.w/2,o.y+180,.8)}
/* minimap */
function drawMini(){
const m=$('#minimap');if(!m)return;m.innerHTML='';
const b=bounds(),pad=200,x0=b[0]-pad,y0=b[1]-pad,W=b[2]-b[0]+2*pad,H=b[3]-b[1]+2*pad,sc=Math.min(190/W,120/H);
m._t={x0,y0,sc};
const dot=(x,y,w,hh)=>{const d=h('div',{class:'md'});d.style.cssText=`left:${(x-x0)*sc}px;top:${(y-y0)*sc}px;width:${Math.max(2,w*sc)}px;height:${Math.max(2,hh*sc)}px`;m.appendChild(d)};
S.companies.forEach(c=>{const s=coSize(c);dot(c.x,c.y,s.w,s.h)});
for(const k in S.objs){const o=S.objs[k];dot(o.x,o.y,o.w,200)}
const z=S.cam.z,v=h('div',{class:'mv'});
v.style.cssText=`left:${(-S.cam.x/z-x0)*sc}px;top:${(-S.cam.y/z-y0)*sc}px;width:${vp.clientWidth/z*sc}px;height:${vp.clientHeight/z*sc}px`;m.appendChild(v)}
$('#minimap').addEventListener('pointerdown',e=>{
const m=$('#minimap'),t=m._t;if(!t)return;const r=m.getBoundingClientRect();
focusOn((e.clientX-r.left)/t.sc+t.x0,(e.clientY-r.top)/t.sc+t.y0)});
/* Donna */
function populateScope(){
const s=$('#cscope'),old=s.value;s.innerHTML='';s.appendChild(h('option',{value:''},'All companies'));
S.companies.forEach(c=>{s.appendChild(h('option',{value:'c:'+c.id},c.name));S.depts.filter(d=>d.co==c.id).forEach(d=>s.appendChild(h('option',{value:'d:'+d.id},'  '+d.name)))});if(Array.from(s.options).some(o=>o.value===old))s.value=old}
function addMsg(t,who,label){const m=h('div',{class:'m '+who});if(label)m.appendChild(h('small',{},label));m.appendChild(document.createTextNode(t));const ms=$('#msgs');ms.appendChild(m);ms.scrollTop=ms.scrollHeight}
function clampChat(){const d=$('#donna');d.style.maxWidth=Math.max(160,innerWidth-16)+'px';$('#chatwin').style.height=Math.max(140,Math.min(340,innerHeight-140))+'px';if(d.style.top&&!d.classList.contains('col')){const r=d.getBoundingClientRect();d.style.left=Math.max(8,Math.min(innerWidth-r.width-8,r.left))+'px';d.style.top=Math.max(52,Math.min(innerHeight-r.height-8,r.top))+'px'}}
function openChat(open){const d=$('#donna');if(!open&&d.style.top){const r=d.getBoundingClientRect();d.style.top=Math.min(innerHeight-8,r.bottom)+'px'}d.classList.toggle('col',!open);if(open&&!$('#msgs').children.length){addMsg('Your office is ready. Choose a company or team, then tell me what to move forward. I can open tools and pin draft tasks for a sub-Donna. Demo mode.','d','Donna · Demo')}if(open){clampChat();$('#cin').focus()}else $('#dav').focus()}
$('#dav').onclick=()=>openChat($('#donna').classList.contains('col'));
$('#dav').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();$('#dav').click()}};
$('#cform').onsubmit=e=>{e.preventDefault();const i=$('#cin'),v=i.value.trim();if(!v)return;i.value='';
const sv=$('#cscope').value,co=sv.startsWith('c:')?byId(S.companies,sv.slice(2)):null,dp=sv.startsWith('d:')?byId(S.depts,sv.slice(2)):null,name=co?co.name:dp?dp.name:'All companies',sub=sv?'Sub-Donna · '+name:'Donna';
addMsg(v,'u');const q=v.toLowerCase();
if(/^(create|new|add) (a )?company/.test(q)){companyForm();addMsg('Company form opened. Choose its parent, then place the office on your table.','d','Donna · local action');return}
if(/^(add|new|create) (a )?(sticky|note)/.test(q)){stickyForm();addMsg('Note form opened. Your note will be saved on the whiteboard.','d','Donna · local action');return}
if(/^(show|open|focus) (the )?(whiteboard|softboard|roadmap|activity)/.test(q)){const k=q.includes('whiteboard')?'white':q.includes('softboard')?'soft':q.includes('roadmap')?'road':'spend';focusBoard(k);addMsg('Brought the requested board into view.','d','Donna · local action');return}
if(q.includes('active teams')||q.includes('heatmap')){heat=true;applyHeat();home();addMsg('Sample activity lighting is on. Running, loaded, waiting and blocked remain distinct.','d','Donna · local action');return}
addMsg('Draft handoff for '+sub+' in '+name+'. Review it here, then pin it as an unassigned task. No agent will execute it in this prototype.','d','Delegation preview');
const button=h('button',{class:'btn draft-pin',type:'button'},'Pin draft to whiteboard');$('#msgs').lastElementChild.appendChild(button);
button.onclick=()=>{const task={id:uid('t'),text:v.slice(0,180),owner:null,done:false,scope:sv};S.tasks.unshift(task);pushUndo(()=>{S.tasks=S.tasks.filter(t=>t.id!==task.id)});save();renderBoards();button.disabled=true;button.textContent='Draft pinned';focusBoard('white');toast('Draft added to the whiteboard')};
};
const suggestions=h('div',{class:'suggestions'});[['New company',()=>companyForm()],['Add a note',()=>stickyForm()],['Activity',()=>{heat=true;applyHeat();home()}]].forEach(([label,action])=>{const b=h('button',{type:'button',class:'btn'},label);b.onclick=action;suggestions.appendChild(b)});$('#chatwin').insertBefore(suggestions,$('#cform'));
(()=>{const w=$('#chatwin'),hd=$('#chandle'),d=$('#donna');
hd.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=d.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;hd.setPointerCapture(e.pointerId);
const mv=ev=>{d.style.right='auto';d.style.bottom='auto';d.style.left=(r.left+ev.clientX-sx)+'px';d.style.top=(r.top+ev.clientY-sy)+'px';clampChat()};
const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up)};hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up)});
hd.addEventListener('dblclick',()=>openChat(false))})();
/* toggles */
function applyTheme(){document.body.dataset.theme=S.theme;$('#theme').value=S.theme}
function applyTilt(){vp.classList.toggle('tilt',S.tilt);$('#bTilt').classList.toggle('on',S.tilt);$('#bTilt').setAttribute('aria-pressed',S.tilt)}
function applyHeat(){$('#legend').classList.toggle('show',heat);$('#bHeat').classList.toggle('on',heat);$('#bHeat').setAttribute('aria-pressed',heat);renderScene()}
$('#theme').onchange=e=>{S.theme=e.target.value;applyTheme();save()};
$('#bTilt').onclick=()=>{S.tilt=!S.tilt;applyTilt();save()};
$('#bHeat').onclick=()=>{heat=!heat;applyHeat()};
$('#bHome').onclick=home;$('#bFit').onclick=fit;
const zc=f=>zoomAt(f,vp.clientWidth/2,vp.clientHeight/2);
$('#bZm').onclick=()=>zc(1/1.2);$('#bZp').onclick=()=>zc(1.2);
$('#bSearch').onclick=searchWin;$('#bHelp').onclick=helpWin;
function doUndo(){const f=undo.pop();if(!f){toast('Nothing to undo');return}f();save();renderScene();renderBoards()}
$('#bUndo').onclick=doUndo;
function resetDemo(){S=seed();undo=[];sel=null;heat=false;stack.slice().forEach(i=>closeWin(i,true));try{localStorage.removeItem(KEY)}catch(e){}applyTheme();applyTilt();applyHeat();renderBoards();populateScope();home();toast('Demo reset')}
document.querySelectorAll('.tray [data-t]').forEach(b=>b.onclick=()=>{
const t=b.dataset.t;
if(t=='company')companyForm();else if(t=='hire')hireForm();else if(t=='dept')deptForm();else if(t=='sticky')stickyForm();
else if(t=='budget')budgetWin();else if(t=='roles')rolesWin();else if(t=='reset')resetDemo();
else if(t.startsWith('b-'))focusBoard({white:'white',soft:'soft',road:'road',spend:'spend'}[t.slice(2)])});
/* keyboard */
function typing(t){return t&&(t.tagName=='INPUT'||t.tagName=='TEXTAREA'||t.tagName=='SELECT'||t.isContentEditable)}
document.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();$('#search')?closeSearch():searchWin();return}
if(e.key=='Escape'){if($('#search')){closeSearch();return}if(stack.length){const id=stack[stack.length-1];sel=null;renderScene();closeWin(id);return}if(!$('#donna').classList.contains('col'))openChat(false);return}
if(typing(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;
const k=e.key,st=60;let used=true;
if(k=='ArrowLeft'||k=='a')S.cam.x+=st;else if(k=='ArrowRight'||k=='d')S.cam.x-=st;else if(k=='ArrowUp'||k=='w')S.cam.y+=st;else if(k=='ArrowDown'||k=='s')S.cam.y-=st;
else if(k=='+'||k=='=')zc(1.2);else if(k=='-'||k=='_')zc(1/1.2);
else if(k=='h'||k=='H')home();else if(k=='f'||k=='F')fit();else if(k=='t'||k=='T')$('#bTilt').click();else if(k=='m'||k=='M')$('#bHeat').click();
else if(k=='n'||k=='N')stickyForm();else if(k=='?')helpWin();else if((k=='z'||k=='Z'))doUndo();else used=false;
if(used){e.preventDefault();applyCam();save()}});
window.addEventListener('resize',()=>{drawMini();document.querySelectorAll('.win').forEach(clampWin);clampChat()});
/* init */
applyTheme();applyTilt();renderScene();renderBoards();populateScope();
if(S.cam.home){S.cam.home=0;home()}else applyCam();
if(loadWarning)toast(loadWarning);
})();
