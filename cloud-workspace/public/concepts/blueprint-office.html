<!DOCTYPE html>
<!--
  Daftar — infinite blueprint company office
  Front-end concept authored with Claude Sonnet; independently reviewed.

  PROTOTYPE ONLY: all companies, people, tasks, chat replies and permissions are
  SYNTHETIC. No network calls, no backend, no credentials. Persistence is limited
  to a bounded, validated localStorage key (theme / popup geometry / demo companies / task state).
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<title>Daftar — Design preview · local demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#0a1224; --ink2:#0e1a33; --ink3:#14233f;
  --line:#8fb2e6; --line-dim:#4a6794; --grid1:rgba(120,160,220,.07); --grid2:rgba(120,160,220,.14);
  --text:#e9e2cf; --text-dim:#9fb0cc; --accent:#e5c27a; --sage:#8fc4a3; --amber:#e8b45c; --rose:#d98a8a;
  --sheet:#efe6cf; --sheet2:#e4d8bb; --sheet-ink:#1f3a6e; --sheet-line:#2c4f92; --sheet-fill:rgba(44,79,146,.06);
  --table:#16253f; --table2:#1b2e4d; --table-edge:#2c456f;
  --chrome:rgba(12,22,42,.88); --chrome-b:rgba(143,178,230,.28); --pop:#101e38; --pop-b:#35537f;
  --shadow:0 14px 34px rgba(0,0,0,.45); --focus:#ffd98a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
}
html[data-theme="paper"]{
  --ink:#d9d2c0; --ink2:#e4ddca; --ink3:#cfc7b2;
  --line:#33558c; --line-dim:#6c85b0; --grid1:rgba(40,70,120,.07); --grid2:rgba(40,70,120,.15);
  --text:#1c2a45; --text-dim:#54627e; --accent:#9a6a12; --sage:#3f7d5b; --amber:#b9791c; --rose:#a64a4a;
  --sheet:#fbf7ea; --sheet2:#efe8d2; --sheet-ink:#1b3566; --sheet-line:#24448a; --sheet-fill:rgba(36,68,138,.06);
  --table:#c7bea6; --table2:#d3cab2; --table-edge:#a99f84;
  --chrome:rgba(247,243,230,.92); --chrome-b:rgba(36,68,138,.3); --pop:#fbf7ea; --pop-b:#8a93a8;
  --shadow:0 12px 28px rgba(60,50,20,.28); --focus:#a45b00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background:
   radial-gradient(1200px 700px at 50% 40%,var(--ink3),transparent 70%),
   linear-gradient(var(--grid2) 1px,transparent 1px) 0 0/160px 160px,
   linear-gradient(90deg,var(--grid2) 1px,transparent 1px) 0 0/160px 160px,
   linear-gradient(var(--grid1) 1px,transparent 1px) 0 0/32px 32px,
   linear-gradient(90deg,var(--grid1) 1px,transparent 1px) 0 0/32px 32px,
   var(--ink)}
#viewport.panning{cursor:grabbing}
#viewport::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.28) 100%)}
html[data-theme="paper"] #viewport::after{background:radial-gradient(ellipse at center,transparent 60%,rgba(80,60,20,.18) 100%)}
#persp{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 40%}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#tilt{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .5s ease}
#tilt.flat{transform:none!important}

/* table */
.table{position:absolute;border-radius:60px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 3px,transparent 3px 11px),
  linear-gradient(180deg,var(--table2),var(--table));
  border:2px solid var(--table-edge);box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 0 0 10px rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,.08)}
.tlabel{position:absolute;font:600 13px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text-dim);opacity:.75;white-space:nowrap}

/* sheets */
.sheet{position:absolute;background:
  radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 50%),var(--sheet);
  border-radius:3px;box-shadow:0 3px 0 var(--sheet2),0 22px 40px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.08);
  background-image:linear-gradient(rgba(44,79,146,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(44,79,146,.06) 1px,transparent 1px);
  background-size:24px 24px;background-color:var(--sheet);color:var(--sheet-ink);transition:opacity .4s,filter .4s}
.sheet.dim{opacity:.55;filter:saturate(.6) brightness(.85)}
.sheet.dim .planwrap{pointer-events:none}
.sheet::before{content:"";position:absolute;right:0;bottom:0;width:46px;height:46px;background:linear-gradient(135deg,transparent 50%,var(--sheet2) 50%,rgba(0,0,0,.12));border-top-left-radius:6px}
.titleblock{position:absolute;left:24px;bottom:16px;display:flex;gap:18px;align-items:baseline;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--sheet-line);pointer-events:none}
.titleblock b{font:italic 700 22px var(--serif);letter-spacing:0;text-transform:none;color:var(--sheet-ink)}
.stamp{position:absolute;right:26px;top:16px;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--sheet-line);border:1.5px solid var(--sheet-line);padding:3px 8px;border-radius:3px;transform:rotate(2deg);pointer-events:none}

/* plan svg */
svg text{font-family:var(--sans);user-select:none;-webkit-user-select:none}
.room{cursor:pointer}
.room .fill{fill:var(--sheet-fill);transition:fill .2s}
.room:hover .fill,.room.sel .fill{fill:rgba(44,79,146,.17)}
.room:focus-visible{outline:none}
.room:focus-visible .fill{stroke:var(--focus);stroke-width:4}
.wall{fill:none;stroke:var(--sheet-line);stroke-width:5;stroke-linejoin:miter}
.thin{fill:none;stroke:var(--sheet-line);stroke-width:1.4}
.furn{fill:rgba(255,255,255,.55);stroke:var(--sheet-line);stroke-width:1.3}
.rname{font-weight:700;font-size:24px;letter-spacing:.035em;text-transform:uppercase;fill:var(--sheet-ink)}
.rsub{font-size:15px;fill:var(--sheet-line);letter-spacing:.02em}
.seat{cursor:pointer}
.seat circle.dot{fill:var(--sheet-ink);stroke:#fff;stroke-width:1.5;transition:r .15s}
.seat:hover circle.dot,.seat:focus-visible circle.dot{r:9}
.seat:focus-visible{outline:none}
.seat:focus-visible circle.ring{stroke:var(--focus);stroke-width:3}
.seat circle.ring{fill:none;stroke:transparent}
.seat text{font-size:16px;font-weight:600;fill:var(--sheet-ink)}
.seat .hit{fill:transparent;pointer-events:all}
.seat .badge-text{font-size:10px;fill:#10261a}
.tagS{fill:var(--sage)} .tagV{fill:var(--amber)}
.room.restricted .fill,.room.restricted:hover .fill,.room.restricted.sel .fill{fill:var(--restricted-fill,#58606c)}
.room.restricted .rname{fill:#f7f9ff}
.room.restricted .rsub{fill:#e1e8f5}
.room.restricted .wall{stroke:#27303c}
.tour-hi{filter:drop-shadow(0 0 10px var(--focus))}

/* chairs */
.chair{position:absolute;width:96px;height:96px;border:0;background:none;padding:0;color:var(--text);text-align:center}
.chair svg{width:96px;height:80px;display:block;margin:0 auto;overflow:visible}
.chair .cl{position:absolute;left:50%;top:84px;transform:translateX(-50%);white-space:nowrap;font:600 12px var(--sans);letter-spacing:.06em;padding:2px 8px;border-radius:10px;background:var(--chrome);border:1px solid var(--chrome-b)}
.chair .seatp{fill:var(--ink2);stroke:var(--line);stroke-width:1.4;transition:fill .2s}
.chair:hover .seatp,.chair.sel .seatp{fill:var(--accent);stroke:var(--accent)}
.chair.sel .cl{background:var(--accent);color:#1b1608;border-color:var(--accent)}
.chair:focus-visible{outline:2px solid var(--focus);border-radius:12px}

/* boards */
.board{position:absolute;border-radius:6px;box-shadow:0 18px 36px rgba(0,0,0,.45);color:#2a2418;display:flex;flex-direction:column;overflow:hidden}
.board .bh{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:move;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;touch-action:none}
.board .bh span{flex:1}
.board .bb{flex:1;overflow:auto;padding:8px 10px 10px;min-height:0}
.board .bf{padding:6px 10px 8px;display:flex;gap:6px}
.b-road{background:#f3ead0;border:6px solid #8a6a3c;background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:100% 22px}
.b-own{background:#e9eef6;border:6px solid #55688c}
.b-white{background:#fbfbf6;border:6px solid #aeb4bf}
.b-cork{background:#c79a64;border:6px solid #6b4a26;background-image:radial-gradient(rgba(90,55,20,.25) 1.2px,transparent 1.6px);background-size:9px 9px;color:#2a1a08}
.bh{background:rgba(0,0,0,.08)}
.ibtn{min-width:28px;height:28px;border-radius:5px;border:1px solid rgba(0,0,0,.3);background:rgba(255,255,255,.55);display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font:600 12px var(--sans);color:#222}
.ibtn:hover{background:#fff}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:100%}
.lane h4{margin:0 0 6px;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#6a5a36}
.note{display:block;width:100%;text-align:left;border:0;padding:7px 8px;margin:0 0 7px;border-radius:2px;font:500 12.5px/1.3 var(--sans);color:#2a2418;box-shadow:0 3px 6px rgba(0,0,0,.2);min-height:30px;position:relative}
.note small{display:block;opacity:.7;font-size:11px;margin-top:3px}
.n0{background:#f6e27a}.n1{background:#b8dcb0}.n2{background:#f4b9a3}.n3{background:#a9cdea}
.trow{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px dashed rgba(0,0,0,.18);font-size:12.5px}
.trow .tt{flex:1;min-width:0}
.trow select{font-size:12px;height:26px;border-radius:4px;border:1px solid #8a96b0;background:#fff;color:#222;max-width:90px}
.pill{font:700 11px var(--sans);padding:2px 7px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.25);color:#222;white-space:nowrap}
.wbpad{position:relative;min-height:100%}
.hier{font-size:12.5px}
.hier .hn{display:inline-block;background:#fff7dc;border:1px solid #6b4a26;border-radius:3px;padding:4px 8px;margin:2px 0;box-shadow:0 2px 4px rgba(0,0,0,.25);font-weight:600}
.hier ul{list-style:none;margin:0 0 0 14px;padding:0 0 0 12px;border-left:2px solid #6b4a26}
.hier>ul{margin-left:4px}
.hier .lk{font-size:10.5px;color:#4b3414;font-style:italic;margin:0 6px}

/* chrome */
.chrome{position:fixed;z-index:30;background:var(--chrome);border:1px solid var(--chrome-b);backdrop-filter:blur(8px);border-radius:12px;box-shadow:var(--shadow)}
#brand{left:16px;top:14px;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 14px;max-width:46vw}
#brand .wm{font:italic 700 24px var(--serif);letter-spacing:.01em;color:var(--text);white-space:nowrap}
#brand .wm i{color:var(--accent);font-style:normal}
#brand .crumb{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand .crumb b{color:var(--text);font-weight:600}
#locator{left:50%;top:14px;transform:translateX(-50%);width:min(380px,30vw);min-width:220px;padding:4px}
#locator input{width:100%;height:36px;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.05);padding:0 12px;font-size:14px;color:var(--text)}
#locator input::placeholder{color:var(--text-dim)}
#locres{position:absolute;left:0;right:0;top:46px;background:var(--pop);border:1px solid var(--pop-b);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:260px;overflow-y:auto}
#locres button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--chrome-b);min-height:38px;font-size:14px}
#locres button:hover,#locres button:focus-visible{background:rgba(143,178,230,.15)}
#locres small{color:var(--text-dim);margin-left:auto}
#topright{right:16px;top:14px;display:flex;align-items:center;gap:8px;padding:5px}
.btn{height:36px;min-width:36px;padding:0 14px;border-radius:9px;border:1px solid var(--chrome-b);background:rgba(255,255,255,.06);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text)}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1608}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;min-width:30px}
.ceo{display:flex;align-items:center;gap:8px;padding:0 12px 0 5px;height:36px;border-radius:18px;border:1px solid var(--chrome-b);background:rgba(255,255,255,.05);font-weight:600;font-size:14px;cursor:default}
.ceo .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1b1608;display:grid;place-items:center;font:700 12px var(--sans)}
#rail{left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px}
#rail .btn{border-color:transparent;background:transparent;padding:0 10px}
#rail .btn:hover{background:rgba(255,255,255,.12)}
#rail .btn.on{background:rgba(229,194,122,.22);color:var(--accent)}
#rail .sep{width:1px;height:22px;background:var(--chrome-b);margin:0 4px}
#zoomv{min-width:54px;text-align:center;font-weight:600;font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
#minimap{left:16px;bottom:14px;width:178px;height:116px;padding:0;overflow:hidden;cursor:pointer}
#minimap canvas{display:block;width:100%;height:100%}
#demotag{right:16px;bottom:78px;padding:4px 10px;font-size:12px;color:var(--text-dim);letter-spacing:.04em;pointer-events:none;border-radius:20px}
#orb{right:18px;bottom:16px;width:56px;height:56px;border-radius:50%;border:1px solid var(--accent);background:radial-gradient(circle at 35% 30%,#f5dfae,var(--accent) 60%,#a8812f);color:#1b1608;font:italic 700 24px var(--serif);display:grid;place-items:center;z-index:31;box-shadow:0 8px 22px rgba(0,0,0,.5);padding:0}
#orb .dot{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--sage);border:2px solid var(--ink);}
#orb.hasunread .dot{background:var(--amber)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#orb{animation:bob 4s ease-in-out infinite}

/* popups */
#overlay{position:fixed;inset:0;z-index:40;pointer-events:none}
.pop{position:absolute;pointer-events:auto;background:var(--pop);border:1px solid var(--pop-b);border-radius:12px;box-shadow:var(--shadow);min-width:240px;max-width:min(380px,92vw);display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.pop .ph{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--chrome-b);cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}
.pop .ph h3{margin:0;flex:1;font:700 15px var(--sans);letter-spacing:.01em}
.pop .pb{padding:12px 14px 14px;overflow:auto;font-size:14px}
.pop .x{width:30px;height:30px;border-radius:8px;border:0;background:transparent;font-size:18px;line-height:1;color:var(--text-dim)}
.pop .x:hover{background:rgba(255,255,255,.1);color:var(--text)}
.pop label{display:block;font-size:12px;color:var(--text-dim);margin:10px 0 4px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.pop input[type=text],.pop select,.pop textarea{width:100%;height:36px;border-radius:8px;border:1px solid var(--pop-b);background:rgba(255,255,255,.05);padding:0 10px;color:var(--text)}
.pop select option{color:#111}
.pop .err{color:var(--rose);font-size:13px;min-height:18px;margin-top:6px}
.pop .row{display:flex;gap:8px;margin-top:12px}
.pop .muted{color:var(--text-dim);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--text-dim);font-size:13px}.kv dd{margin:0}
.emp{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.04);margin-bottom:5px;text-align:left;min-height:38px}
.emp:hover{border-color:var(--chrome-b)}
.emp .nm{flex:1;font-weight:600}
.tag{font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:9px}
.tag.s{background:rgba(143,196,163,.2);color:var(--sage);border:1px solid var(--sage)}
.tag.v{background:rgba(232,180,92,.2);color:var(--amber);border:1px solid var(--amber)}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--sage)}
.receipt{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(143,196,163,.14);border:1px solid var(--sage);font-size:13px}

/* chat */
#chat{width:360px;height:390px;max-width:94vw;max-height:calc(100vh - 100px);z-index:2}
#chat .pb{padding:0;display:flex;flex-direction:column;flex:1;min-height:0}
#chat .scope{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--chrome-b);align-items:center}
#chat .scope select{height:30px;font-size:13px;width:auto;flex:1;min-width:0}
#chatlog{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:90%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:#1b1608;border-bottom-right-radius:3px}
.msg.d{align-self:flex-start;background:rgba(255,255,255,.08);border-bottom-left-radius:3px}
.msg small{display:block;color:var(--text-dim);font-size:11px;margin-top:4px;letter-spacing:.05em}
.msg.u small{color:#4a3a14}
#quick{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px}
#quick button{height:30px;border-radius:15px;border:1px solid var(--chrome-b);background:rgba(255,255,255,.05);padding:0 11px;font-size:12.5px}
#quick button:hover{background:rgba(255,255,255,.12)}
#chatform{display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--chrome-b)}
#chatform input{flex:1;height:36px;border-radius:9px;border:1px solid var(--pop-b);background:rgba(255,255,255,.05);padding:0 11px;color:var(--text);min-width:0}
.crew{padding:8px 12px;border-bottom:1px solid var(--chrome-b);font-size:13px;max-height:140px;overflow:auto}
.crew div{padding:3px 0}.crew b{color:var(--accent)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;background:var(--pop);border:1px solid var(--accent);border-radius:20px;padding:7px 16px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#sr{position:absolute;left:-9999px}
@media (max-width:1100px){
  #brand .crumb{display:none}
  #locator{width:240px}
  #minimap{width:140px;height:92px}
}
@media (max-width:760px){
  #minimap,#demotag{display:none}
  #rail .btn span.lbl{display:none}
  #locator{top:62px}
}
@media (prefers-reduced-motion:reduce){
  #orb{animation:none}
  #tilt{transition:none}
  *{scroll-behavior:auto!important}
}

#persp{perspective:none!important}
#world{transform-style:preserve-3d!important;will-change:transform}
#tilt{transform:none!important;transition:none!important;transform-style:preserve-3d!important}
#tilt.flat{transform:none!important}
#tilt *{transform-style:preserve-3d}
.d3co,.d3board,.d3box,.d3face,.d3pin,.d3chair,.d3orb,.d3line,.d3far{position:absolute;transform-style:preserve-3d;transform-origin:0 0}
.d3co{left:0;top:0;width:0;height:0}
.d3co .sheet,.d3co .table{opacity:1!important;filter:none!important}
.d3co.dim .sheet{background-color:var(--sheet2);background-blend-mode:multiply}
.d3co.dim .titleblock,.d3co.dim .rsub{opacity:.5}
.d3face{background:var(--sheet-line);border:1px solid rgba(255,255,255,.25);pointer-events:none;backface-visibility:visible}
.d3face.top{background:var(--sheet-ink);opacity:.92}
.d3face.side{background:#1b3566}
.d3desk .d3face{background:#7d6a45}
.d3desk .d3face.top{background:#b59a63}
.d3box{pointer-events:none}
.d3far{background:var(--sheet);border:3px solid var(--sheet-line);border-radius:3px;cursor:pointer}

<script>
(function(){
"use strict";
/* ===== util ===== */
const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,text){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(text!=null)e.textContent=text;return e;}
function sv(tag,attrs,text){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e;}
const clamp=(v,a,b)=>Math.min(Math.max(a,b),Math.max(a,Number.isFinite(v)?v:a));
const record=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
const validId=v=>typeof v==="string"&&/^[a-z0-9][a-z0-9-]{0,49}$/i.test(v)&&!["__proto__","constructor","prototype"].includes(v);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)");
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800);}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function clean(s,max){return String(s==null?"":s).replace(/[\u0000-\u001f\u007f<>]/g,"").replace(/\s+/g," ").trim().slice(0,max);}

/* ===== synthetic data ===== */
const DEPTS=["Product","Engineering","Design","Research","Operations","Growth"];
const PEOPLE={
 Product:[["Mira Sol","Product Lead","","Roadmap, specs"],["Tomas Ek","Product Manager","S","Pricing"],["Ines Ruiz","Analyst","","Metrics"]],
 Engineering:[["Kofi Adu","Eng Lead","","Platform"],["Lena Voss","Staff Engineer","","Sync engine"],["Dev Rao","Engineer","V","Mobile"]],
 Design:[["Sana Iqbal","Design Lead","","Brand system"],["Jules Park","Product Designer","S","Onboarding"]],
 Research:[["Noor Haddad","Research Lead","","Interviews"],["Eli Brandt","Researcher","","Surveys"],["Yui Mori","Research Ops","S","Panels"]],
 Operations:[["Omar Reyes","Ops Lead","","Vendors"],["Priya Nair","Finance Partner","","Budgets"]],
 Growth:[["Hana Weiss","Growth Lead","","Acquisition"],["Ravi Anand","Lifecycle","","Email"],["Zoe Lund","Content","V","Editorial"]]
};
const SKILLS={"Product Lead":"Strategy · Prioritisation · Stakeholder alignment","Eng Lead":"Architecture · Mentoring · Delivery","Design Lead":"Visual systems · Critique · Prototyping","Research Lead":"Qualitative · Synthesis · Planning","Ops Lead":"Process · Procurement · Risk","Growth Lead":"Channels · Experiments · Analytics"};
const STATE={
 theme:"midnight",flat:false,
 companies:[
  {id:"studio-north",name:"Studio North",kind:"company",demo:false,x:0},
  {id:"orbit-works",name:"Orbit Works",kind:"company",demo:false,x:1},
  {id:"research-lab",name:"Research Lab",kind:"sub",parent:"studio-north",demo:false,x:2}
 ],
 tasks:[
  {id:"t1",t:"Draft Q3 roadmap narrative",lane:0,owner:"Mira Sol",status:"Doing"},
  {id:"t2",t:"Prototype onboarding v2",lane:0,owner:"Jules Park",status:"Doing"},
  {id:"t3",t:"Sync-engine load test",lane:1,owner:"Lena Voss",status:"Todo"},
  {id:"t4",t:"User panel recruitment",lane:1,owner:"Yui Mori",status:"Todo"},
  {id:"t5",t:"Vendor consolidation review",lane:2,owner:"Unassigned",status:"Todo"},
  {id:"t6",t:"Lifecycle email revamp",lane:2,owner:"Unassigned",status:"Todo"}
 ],
 notes:[],geo:Object.create(null),boardPos:Object.create(null)
};
const KEY="daftar.prototype.v1";
const MAX_CO=100;
let selected="studio-north";

/* ===== persistence (bounded, validated, never fatal) ===== */
function load(){
 try{
  const raw=localStorage.getItem(KEY);if(!raw||raw.length>60000)return;
  const o=JSON.parse(raw);if(!record(o))return;
  if(o.theme==="paper"||o.theme==="midnight")STATE.theme=o.theme;
  if(typeof o.flat==="boolean")STATE.flat=o.flat;
  if(Array.isArray(o.extra)){o.extra.slice(0,MAX_CO).forEach(c=>{
    if(!record(c)||STATE.companies.length>=MAX_CO||!validId(c.id))return;
    const name=typeof c.name==="string"?clean(c.name,40):"",id=c.id;
    if(name&&!STATE.companies.some(x=>x.id===id||x.name.toLowerCase()===name.toLowerCase()))STATE.companies.push({id,name,kind:c.kind==="sub"?"sub":"company",...(validId(c.parent)?{parent:c.parent}:{}),demo:true,x:STATE.companies.length});
  });}
  for(const c of STATE.companies)if(c.kind==="sub"&&!STATE.companies.some(p=>p.id===c.parent&&p.id!==c.id&&p.kind==="company")){c.kind="company";delete c.parent;}
  if(Array.isArray(o.tasks)){o.tasks.slice(0,60).forEach(t=>{
    if(!record(t)||typeof t.id!=="string")return;
    const base=STATE.tasks.find(x=>x.id===t.id);
    if(base){if(t.owner==="You")base.owner="You";if(["Todo","Doing","Done"].includes(t.status))base.status=t.status;}
    else if(STATE.tasks.length<60&&/^u\d{1,24}$/.test(t.id)&&typeof t.t==="string"){const tt=clean(t.t,80);if(tt)STATE.tasks.push({id:t.id,t:tt,lane:Number.isInteger(t.lane)?clamp(t.lane,0,2):0,owner:t.owner==="You"?"You":"Unassigned",status:["Todo","Doing","Done"].includes(t.status)?t.status:"Todo"});}
  });}
  if(Array.isArray(o.notes)){o.notes.slice(0,40).forEach(n=>{if(!record(n)||typeof n.t!=="string")return;const tx=clean(n.t,80);if(tx)STATE.notes.push({t:tx,x:clamp(n.x,0,240),y:clamp(n.y,0,160),c:Number.isInteger(n.c)?clamp(n.c,0,3):0});});}
  if(record(o.geo)){for(const k of ["room","person","create","chat","tour","help"]){const g=o.geo[k];if(record(g)&&Number.isFinite(g.x)&&Number.isFinite(g.y))STATE.geo[k]={x:clamp(g.x,0,4000),y:clamp(g.y,0,4000)};}}
  if(record(o.boardPos)){for(const k of Object.keys(o.boardPos).slice(0,MAX_CO*4)){const [id,kind,...rest]=k.split(":"),g=o.boardPos[k];if(!rest.length&&STATE.companies.some(c=>c.id===id)&&["road","own","white","cork"].includes(kind)&&record(g)&&Number.isFinite(g.x)&&Number.isFinite(g.y))STATE.boardPos[k]={x:clamp(g.x,-6000,(MAX_CO+1)*1900),y:clamp(g.y,-3000,3000)};}}
 }catch(e){/* corrupt storage ignored */}
}
function save(){
 try{
  const o={theme:STATE.theme,flat:STATE.flat,
   extra:STATE.companies.filter(c=>c.demo).slice(0,MAX_CO-3).map(c=>({id:c.id,name:c.name,kind:c.kind,...(c.kind==="sub"?{parent:c.parent}:{})})),
   tasks:STATE.tasks.slice(0,60).map(t=>({id:t.id,t:t.id[0]==="u"?t.t:undefined,lane:t.lane,owner:t.owner,status:t.status})),
   notes:STATE.notes.slice(0,40),geo:STATE.geo,boardPos:STATE.boardPos};
  const json=JSON.stringify(o);if(json.length<=60000)localStorage.setItem(KEY,json);
 }catch(e){/* storage unavailable: continue */}
}

/* ===== world geometry ===== */
const SW=1500,SH=980;           // blueprint sheet size
const SPACING=1900;             // company slot spacing
const TABLE_Y=-120;             // table top
const SHEET_Y=60;
function slotX(i){return i*SPACING;}

/* ===== camera ===== */
const cam={x:0,y:0,k:1};
const KMIN=0.12,KMAX=3.2;
let anim=null;
const vp=$("#viewport"),world=$("#world"),tilt=$("#tilt");
function applyCam(){
 cam.k=clamp(cam.k,KMIN,KMAX);
 // bound pan to the finite world extent
 const n=companyList().length;
 const minX=-200-n*SPACING*0.0, maxWx=(n+1)*SPACING+4000;
 const W=innerWidth,H=innerHeight;
 const wx0=-1800,wx1=n*SPACING+2600,wy0=-1600,wy1=2200;
 const lo=W*0.5-wx1*cam.k, hi=W*0.5-wx0*cam.k;
 cam.x=clamp(cam.x,Math.min(lo,hi),Math.max(lo,hi));
 const lo2=H*0.5-wy1*cam.k,hi2=H*0.5-wy0*cam.k;
 cam.y=clamp(cam.y,Math.min(lo2,hi2),Math.max(lo2,hi2));
 world.style.transform="translate3d("+cam.x.toFixed(2)+"px,"+cam.y.toFixed(2)+"px,0) scale("+cam.k.toFixed(4)+")";
 $("#zoomv").textContent=Math.round(cam.k*100)+"%";
 // keep grid scaled with camera
 const g=160*cam.k,g2=32*cam.k;
 vp.style.backgroundSize="auto,"+g+"px "+g+"px,"+g+"px "+g+"px,"+g2+"px "+g2+"px,"+g2+"px "+g2+"px,auto";
 vp.style.backgroundPosition="0 0,"+cam.x+"px "+cam.y+"px,"+cam.x+"px "+cam.y+"px,"+cam.x+"px "+cam.y+"px,"+cam.x+"px "+cam.y+"px,0 0";
 drawMini();
}
function applyTilt(){
 tilt.classList.toggle("flat",STATE.flat);
 tilt.style.transform=STATE.flat?"none":"rotateX(14deg)";
 tilt.style.transformOrigin=(innerWidth/2)+"px "+(innerHeight/2)+"px";
 // transform-origin in world coords: tilt around current visual centre
 const cx=(innerWidth/2-cam.x)/cam.k,cy=(innerHeight/2-cam.y)/cam.k;
 tilt.style.transformOrigin=cx+"px "+cy+"px";
}
function stopAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null;}}
function flyTo(tx,ty,tk,dur,done){
 stopAnim();
 tk=clamp(tk,KMIN,KMAX);
 if(reduce.matches||dur<=0){cam.x=tx;cam.y=ty;cam.k=tk;applyCam();applyTilt();done&&done();return;}
 const sx=cam.x,sy=cam.y,sk=cam.k,t0=performance.now();
 anim={};
 const step=now=>{
  let p=clamp((now-t0)/dur,0,1);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  // interpolate log-zoom for smoothness
  const k=Math.exp(Math.log(sk)+(Math.log(tk)-Math.log(sk))*e);
  cam.k=k;cam.x=sx+(tx-sx)*e;cam.y=sy+(ty-sy)*e;
  applyCam();
  if(p<1)anim.raf=requestAnimationFrame(step);else{anim=null;applyTilt();done&&done();}
 };
 anim.raf=requestAnimationFrame(step);
}
function focusWorld(wx,wy,wk,dur,done){
 flyTo(innerWidth/2-wx*wk,innerHeight/2-wy*wk,wk,dur==null?900:dur,done);
}
function sheetCenter(c){const i=STATE.companies.indexOf(c);return{x:slotX(i)+SW/2,y:SHEET_Y+SH/2};}
function fitCompany(c,dur){
 const p=sheetCenter(c);
 const availW=innerWidth*0.94,availH=innerHeight*0.80;
 const k=Math.min(availW/(SW+80),availH/(SH+60));
 focusWorld(p.x,p.y+10,k,dur);
}
function zoomAt(f,sx,sy){
 stopAnim();
 const nk=clamp(cam.k*f,KMIN,KMAX);if(nk===cam.k)return;
 const wx=(sx-cam.x)/cam.k,wy=(sy-cam.y)/cam.k;
 cam.k=nk;cam.x=sx-wx*nk;cam.y=sy-wy*nk;applyCam();applyTilt();
}

/* ===== plan drawing ===== */
function buildPlan(c,idx){
 const r=rng(idx*977+13);
 const svg=sv("svg",{viewBox:"0 0 1500 920",width:1500,height:920,class:"plansvg"});
 svg.style.position="absolute";svg.style.left="0";svg.style.top="0";
 const g=sv("g");svg.appendChild(g);
 // defs: hatch

 const pat=sv("pattern",{id:"hatch"+idx,width:10,height:10,patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"});
 pat.appendChild(sv("rect",{width:10,height:10,fill:"#4a525f"}));
 pat.appendChild(sv("line",{x1:0,y1:0,x2:0,y2:10,stroke:"#8c94a1","stroke-width":2}));
 defs.appendChild(pat);svg.insertBefore(defs,g);
 // outer shell
 g.appendChild(sv("rect",{x:40,y:40,width:1420,height:830,class:"wall","stroke-width":8,fill:"none"}));
 g.appendChild(sv("rect",{x:50,y:50,width:1400,height:810,class:"thin",fill:"none"}));
 // dimension line
 g.appendChild(sv("line",{x1:40,y1:20,x2:1460,y2:20,class:"thin"}));
 g.appendChild(sv("line",{x1:40,y1:14,x2:40,y2:26,class:"thin"}));g.appendChild(sv("line",{x1:1460,y1:14,x2:1460,y2:26,class:"thin"}));
 g.appendChild(sv("text",{x:750,y:16,"text-anchor":"middle","font-size":11,fill:"#2c4f92"},"42.6 m · SCALE 1:100 (illustrative)"));

 const rooms=[];
 function room(id,name,sub,x,y,w,h,opts){
  opts=opts||{};
  const rg=sv("g",{class:"room"+(opts.restricted?" restricted":""),tabindex:0,role:"button","aria-label":name+(opts.restricted?" — access required":"")+(opts.dept?", department":"")});
  rg.dataset.room=id;
  if(opts.restricted)rg.style.setProperty("--restricted-fill","url(#hatch"+idx+")");
  rg.appendChild(sv("rect",{class:"fill",x:x,y:y,width:w,height:h,fill:opts.restricted?"url(#hatch"+idx+")":""}));
  if(opts.restricted)rg.querySelector(".fill").setAttribute("fill","url(#hatch"+idx+")");
  rg.appendChild(sv("rect",{class:"wall",x:x,y:y,width:w,height:h,"stroke-width":opts.thick||4,stroke:opts.restricted?"#2a2f38":""}));
  const lab=sv("text",{x:x+14,y:y+31,class:"rname"},name);

  if(opts.restricted)lab.setAttribute("fill","#e9edf3");
  rg.appendChild(lab);
  if(sub){const t=sv("text",{x:x+14,y:y+52,class:"rsub"},sub.length>30?sub.slice(0,29)+"…":sub);if(opts.restricted)t.setAttribute("fill","#c3cad6");rg.appendChild(t);}
  g.appendChild(rg);

  return rg;
 }
 function door(x,y,len,dir){ // dir: 'N','S','E','W' hinge side; draws gap + swing arc

  if(dir==="N"){gp.appendChild(sv("rect",{x:x,y:y-4,width:len,height:9,fill:"var(--sheet)"}));gp.appendChild(sv("line",{x1:x,y1:y,x2:x,y2:y-len,class:"thin"}));gp.appendChild(sv("path",{d:`M${x} ${y-len} A ${len} ${len} 0 0 1 ${x+len} ${y}`,class:"thin","stroke-dasharray":"3 3"}));}
  if(dir==="E"){gp.appendChild(sv("rect",{x:x-4,y:y,width:9,height:len,fill:"var(--sheet)"}));gp.appendChild(sv("line",{x1:x,y1:y,x2:x+len,y2:y,class:"thin"}));gp.appendChild(sv("path",{d:`M${x+len} ${y} A ${len} ${len} 0 0 1 ${x} ${y+len}`,class:"thin","stroke-dasharray":"3 3"}));}
  if(dir==="W"){gp.appendChild(sv("rect",{x:x-4,y:y,width:9,height:len,fill:"var(--sheet)"}));gp.appendChild(sv("line",{x1:x,y1:y,x2:x-len,y2:y,class:"thin"}));gp.appendChild(sv("path",{d:`M${x-len} ${y} A ${len} ${len} 0 0 0 ${x} ${y+len}`,class:"thin","stroke-dasharray":"3 3"}));}
  g.appendChild(gp);
 }
 function desk(x,y,w,h){const d=sv("rect",{x,y,width:w,height:h,rx:2,class:"furn"});return d;}

  const [nm,role,tag]=pers;

   sg.appendChild(sv("text",{class:"badge-text",x:x+10+(tag==="S"?16:21),y:y-14.5,"text-anchor":"middle",fill:"#10261a","font-weight":700},tag==="S"?"SHARED":"VISITING"));}

 // DEPARTMENTS: 3 cols x 2 rows

 const q=[[0,0],[innerWidth,0],[innerWidth,innerHeight],[0,innerHeight]].map(p=>d3U(p[0],p[1],0));
 c.strokeStyle="#fff";c.lineWidth=1.5;c.beginPath();q.forEach((p,j)=>{const X=ox+p.x*k,Y=oy+p.y*k;j?c.lineTo(X,Y):c.moveTo(X,Y);});c.closePath();c.stroke();cv._m={ox,oy,k};
};
function d3Rect(g){return g?g.getBoundingClientRect():null;}
function d3WorldAnchor(sx,sy){const p=d3U(clamp(sx,10,innerWidth-340),clamp(sy,60,innerHeight-300),140);return p;}
openPop=function(id,title,build,w,pos){
 if(pops[id]){pops[id].remove();delete pops[id];delete D3.pop[id];}
 const caller=document.activeElement;
 const p=el("div",{class:"pop",role:"dialog","aria-label":title});p.style.zIndex=++popZ;if(w)p.style.width=w+"px";
 const h=el("div",{class:"ph"});h.appendChild(el("h3",null,title));
 const x=el("button",{class:"x","aria-label":"Close "+title},"\u00d7");x.addEventListener("click",()=>closePop(id));h.appendChild(x);
 const b=el("div",{class:"pb"});build(b,p);p.appendChild(h);p.appendChild(b);overlay.appendChild(p);
 const g=pos||STATE.geo[id]||{x:(innerWidth-300)/2,y:100},W=p.offsetWidth||300,Hh=Math.min(p.offsetHeight||300,innerHeight-100);
 const sx=clamp(g.x,0,Math.max(0,innerWidth-W)),sy=clamp(g.y,50,Math.max(50,innerHeight-Hh-10));
 D3.pop[id]=d3U(sx,sy,140);p.dataset.caller="";D3.ret=D3.ret||Object.create(null);D3.ret[id]=caller&&caller.focus?caller:null;
 pops[id]=p;d3Bill();
 p.addEventListener("wheel",e=>{e.stopPropagation();},{passive:true});
 p.addEventListener("pointerdown",e=>e.stopPropagation());
 h.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;p.style.zIndex=++popZ;
  const start=d3P(D3.pop[id].x,D3.pop[id].y,140),orig={x:D3.pop[id].x,y:D3.pop[id].y};
  const mv=ev=>{D3.pop[id]=d3U(clamp(start.x+ev.clientX-e.clientX,0,Math.max(0,innerWidth-(p.offsetWidth||300))),clamp(start.y+ev.clientY-e.clientY,50,Math.max(50,innerHeight-(p.offsetHeight||300)-10)),140);d3Bill();};
  d3Gesture(h,e,mv,ok=>{if(!ok){D3.pop[id]=orig;d3Bill();}else{const s=d3P(D3.pop[id].x,D3.pop[id].y,140);STATE.geo[id]={x:clamp(s.x,0,4000),y:clamp(s.y,0,4000)};save();}});
 });
 const f=p.querySelector("input,select,button.emp");if(f&&id!=="chat")f.focus();
 return p;
};
closePop=function(id){
 if(id==="chat"&&pops[id]){const input=pops[id].querySelector("#chatform input");if(input)chatDraft=input.value.slice(0,200);}
 if(pops[id]){pops[id].remove();delete pops[id];delete D3.pop[id];}
 const r=D3.ret&&D3.ret[id];if(D3.ret)delete D3.ret[id];
 if(id==="chat")$("#orb").setAttribute("aria-expanded","false");
 const t=id==="chat"?$("#orb"):r;if(t&&t.isConnected&&t.focus)t.focus();
};
function d3Ask(title,label,cb){
 openPop("d3ask",title,b=>{
  b.appendChild(el("label",null,label));const i=el("input",{type:"text",maxlength:80,"aria-label":label});b.appendChild(i);
  const rw=el("div",{class:"row"}),ok=el("button",{class:"btn primary"},"Add"),cn=el("button",{class:"btn"},"Cancel");rw.appendChild(ok);rw.appendChild(cn);b.appendChild(rw);
  const go=()=>{const v=clean(i.value,80);closePop("d3ask");if(v)cb(v);};
  ok.addEventListener("click",go);cn.addEventListener("click",()=>closePop("d3ask"));i.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
 },300,{x:innerWidth/2-150,y:innerHeight/2-80});
}
addTask=function(){d3Ask("New task","Task (local demo)",t=>{if(STATE.tasks.length>=60){toast("Task limit reached");return;}STATE.tasks.push({id:"u"+Date.now(),t,lane:0,owner:"Unassigned",status:"Todo"});save();refreshBoards();});};
addNote=function(){d3Ask("New sticky note","Note text",t=>{if(STATE.notes.length>=40){toast("Note limit reached");return;}STATE.notes.push({t,x:Math.random()*240|0,y:Math.random()*160|0,c:Math.random()*4|0});save();refreshBoards();});};
const d3Bind=bindPlans;
bindPlans=function(){
 STATE.companies.forEach(c=>{
  if(!c.plan)return;
  const idx=STATE.companies.indexOf(c);
  const aim=(wx,wy,after)=>focusWorld(wx,wy,1.5,600,after,20);
  const svgPt=(n)=>({x:slotX(idx)+30+.94*(+n.dataset.x),y:SHEET_Y+30+.94*(+n.dataset.y)});
  c.plan.svg.querySelectorAll(".room").forEach(rg=>{
   const rm=c.plan.rooms.find(x=>x.g===rg);
   const act=ev=>{selectCo(c);const cx=slotX(idx)+30+.94*(rm.x+rm.w/2),cy=SHEET_Y+30+.94*(rm.y+rm.h/2);
    aim(cx,cy,()=>{const live=c.plan&&c.plan.rooms.find(r=>r.id===rm.id);if(live)roomPop(c,rm.id,rm.name,rectEv(live.g));});};
   rg.addEventListener("click",ev=>{if(ev.target.closest(".seat"))return;act(ev);});
   rg.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();act(ev);}});
  });
  c.plan.svg.querySelectorAll(".seat").forEach(sg=>{
   const act=ev=>{ev.stopPropagation();selectCo(c);const d=sg.dataset.dept,nm=sg.dataset.person;const p=(PEOPLE[d]||[]).find(x=>x[0]===nm)||[nm,d==="Assistant"?"Assistant":d,"",""];const w=svgPt(sg);
    aim(w.x,w.y,()=>{if(nm==="Donna"){openChat();return;}const live=c.plan&&[...c.plan.svg.querySelectorAll(".seat")].find(s=>s.dataset.person===nm&&s.dataset.dept===d);if(live)personPop(p,d,rectPos(live));});};
   sg.addEventListener("click",act);sg.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();act(ev);}});
  });
  c.sheet.addEventListener("click",ev=>{if(selected!==c.id&&!ev.target.closest(".room,.seat"))selectCo(c);});
 });
};
const d3Theme=applyTheme;
applyTheme=function(){STATE.flat=false;d3Theme();$("#d3Btn").textContent=d3Angles[1]===Math.round(D3.P*180/Math.PI)?"Angle 38\u00b0":"Angle "+Math.round(D3.P*180/Math.PI)+"\u00b0";$("#d3Btn").classList.add("on");$("#d3Btn").setAttribute("aria-pressed","true");};
function d3Angle(change){stopAnim();const anchor=d3U(innerWidth/2,innerHeight/2,0);change();const projected=d3P(anchor.x,anchor.y,0);cam.x+=innerWidth/2-projected.x;cam.y+=innerHeight/2-projected.y;applyTheme();applyCam();}
function d3Orbit(d){d3Angle(()=>{D3.A=clamp(D3.A+d*Math.PI/180,-Math.PI,Math.PI);});}
function d3Cycle(){d3Angle(()=>{const cur=Math.round(D3.P*180/Math.PI),i=d3Angles.indexOf(cur);D3.P=d3Angles[(i+1)%3]*Math.PI/180;});}
let d3Wired=false;
const d3Wire=wire;
wire=function(){
 d3Wire();
 if(d3Wired)return;d3Wired=true;
 const nb=$("#d3Btn").cloneNode(true);$("#d3Btn").replaceWith(nb);
 nb.addEventListener("click",d3Cycle);
 const rail=$("#rail"),mkb=(t,l,f)=>{const b=el("button",{class:"btn","aria-label":l},t);b.addEventListener("click",f);return b;};
 const L=mkb("\u21ba","Orbit left",()=>d3Orbit(-12)),R=mkb("\u21bb","Orbit right",()=>d3Orbit(12));
 rail.insertBefore(L,nb);rail.insertBefore(R,nb);
 document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select"))return;if(e.key==="t"||e.key==="T"){e.stopImmediatePropagation();d3Cycle();}else if(e.key==="["){d3Orbit(-12);}else if(e.key==="]"){d3Orbit(12);}},true);
 vp.addEventListener("pointerdown",stopAnim,true);
 document.addEventListener("keydown",e=>{if(anim&&!e.target.closest("input,textarea,select"))stopAnim();},true);
 vp.addEventListener("pointerdown",e=>{if(e.target.closest(".d3chair,.d3orb,.pop"))e.stopPropagation();},false);
 document.addEventListener("visibilitychange",()=>{if(document.hidden)stopAnim();});
 addEventListener("blur",stopAnim);
 applyCam();
};

STATE.flat=false;

load();applyTheme();buildScene();bindPlans();wire();
selectCo(curCo());
cam.k=0.5;fitCompany(curCo(),0);applyTilt();
