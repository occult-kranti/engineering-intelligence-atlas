<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  // Light or dark before the first paint: the saved choice, else the system's (view.js keeps it).
  (function () {
    var t = null;
    try { t = localStorage.getItem('atech-view-theme'); } catch (e) { /* no storage */ }
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<title>Atech board view</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='2' fill='%23334155'/%3E%3Crect x='4' y='3' width='3' height='3' fill='%2338bdf8'/%3E%3Crect x='9' y='3' width='3' height='3' fill='%2394a3b8'/%3E%3Crect x='4' y='8' width='3' height='3' fill='%2394a3b8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/view.css">
<script type="importmap">
{ "imports": {
    "three": "/static/vendor/three/build/three.module.js",
    "three/addons/": "/static/vendor/three/addons/"
} }
</script>
</head>
<body>
<main id="app">
  <section id="stage" aria-label="3D view of the board">
    <div id="canvas-host"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="hover" class="vp-hover" hidden></div>
    <div id="banner" role="alert" hidden></div>
    <div id="toolbar">
      <button type="button" data-view="iso" title="Back to the starting view">Iso</button>
      <button type="button" data-view="top" title="Look at the top face">Top</button>
      <button type="button" data-view="bottom" title="Look at the bottom face">Bottom</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="show-ports" aria-pressed="false" title="Number the ports on the board">Port numbers</button>
    </div>
    <div id="loading">Loading the board…</div>
  </section>

  <aside id="panel">
    <header>
      <div class="eyebrow">Atech board view</div>
      <button type="button" id="theme" class="theme-btn" aria-label="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <h1 id="project-name">—</h1>
      <p id="board-note" class="note" hidden></p>
      <div id="live" class="live" data-state="connecting"><span class="dot"></span><span class="text">Connecting</span></div>
    </header>

    <section id="cautions" hidden></section>

    <section>
      <table id="modules-table" class="ptable"><thead><tr><th scope="col">Port</th><th scope="col">Module</th></tr></thead><tbody id="modules"></tbody></table>
      <p id="no-modules" class="muted" hidden>No modules in <code>project.yaml</code> yet.</p>
    </section>

    <section id="unplaced-section" hidden>
      <h2>Not drawn</h2>
      <table class="ptable bad"><thead><tr><th scope="col">Port</th><th scope="col">Module</th></tr></thead><tbody id="unplaced"></tbody></table>
    </section>
  </aside>
</main>
<script type="module" src="/static/view.js"></script>
</body>
</html>
