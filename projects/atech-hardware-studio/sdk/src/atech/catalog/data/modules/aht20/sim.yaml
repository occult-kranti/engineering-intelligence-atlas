# Simulation data for the Atech `aht20` module, read by `atech.sim`
# (`atech sim-assets`). Frames and every field: src/atech/docs/sim_assets.md.
# Asset frame: metres, origin at the centre of the bottom (mounting) face,
# +z out of the top face, +x along the long side.
#
# Box sizes are the bounds of Atech's production CAD (atechdotdev/atech-module-renders
# v1.5, glb_plain/temp-sensor.glb, converted to +z up). The CAD footprint is centred
# 0.15 mm toward -x; the boxes ignore that. `atech sim-assets --meshes/--fetch`
# uses that CAD for the visuals. Atech has not published masses: the mass, colours,
# connector, physics material and device frames are guesses, marked PLACEHOLDER.
#
# Sensor: Aosong AHT20 temperature and relative-humidity sensor.
schema: 1

size_m: [0.0195, 0.0195, 0.00954]  # CAD: atech-module-renders v1.5 glb_plain/temp-sensor.glb bounds
mass_kg: 0.006                  # PLACEHOLDER: replace with Atech module datasheet

colors:                          # PLACEHOLDER: replace with Atech module datasheet
  body: [0.12, 0.13, 0.15, 1]
  chip: [0.18, 0.18, 0.18, 1]

connector:                       # PLACEHOLDER: replace with Atech module datasheet
  # Mates with the board's port frame: centre of the bottom face.
  pos_m: [0, 0, 0]
  rpy_deg: [0, 0, 0]

physics_material:                # PLACEHOLDER: replace with Atech module datasheet
  static_friction: 0.5
  dynamic_friction: 0.4
  restitution: 0.1

sensor:
  type: temperature_humidity
  chip: AHT20
  frame:                          # chip centre   # PLACEHOLDER: replace with Atech module datasheet
    pos_m: [0, 0, 0.00954]
    rpy_deg: [0, 0, 0]
  temperature_range_c: [-40, 125] # catalog
  humidity_range_pct: [0, 100]    # catalog
  measurement_time_s: 0.075       # catalog: ~75 ms per measurement
  event_period_s: 2.0             # catalog: events every 2 s

semantic:
  # Wikidata Q-codes (SimReady SL.003), checked on wikidata.org.
  wikidata_qcode: [Q646, Q183173, Q167676]   # thermometer, hygrometer, sensor
  class: [temperature_humidity_sensor, sensor]

# Fields above that are guesses, not Atech data (exported as atech:placeholders).
placeholders: [mass_kg, colors, connector, physics_material, sensor.frame]
