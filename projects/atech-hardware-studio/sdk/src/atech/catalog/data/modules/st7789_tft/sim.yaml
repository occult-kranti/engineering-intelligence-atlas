# Simulation data for the Atech `st7789_tft` module (the Big Screen), read by `atech.sim`
# (`atech sim-assets`). Frames and every field: src/atech/docs/sim_assets.md. Asset
# frame: metres, origin at the centre of the bottom face of the cell over its port, +z
# out of the top face, +y toward the outer face.
#
# Two ports wide; the display reaches 40 mm past the port cell toward the outer face
# (+y), so the body box is the port cell and `display` is the rest. Visual: Atech's CAD.
#
# Output: 320x240 colour IPS TFT, ST7789 controller. Spans two ports.
schema: 1

size_m: [0.0395, 0.01975, 0.0095]  # CAD: atech-module-renders v1.7 glb_plain/big-screen.glb, the port cell
mass_kg: 0.02                   # PLACEHOLDER: replace with Atech module datasheet

colors:                          # PLACEHOLDER: replace with Atech module datasheet
  body: [0.12, 0.13, 0.15, 1]

parts:                           # CAD: big-screen.glb bounds beyond the port cell
  - {name: display, size_m: [0.0395, 0.03998, 0.0095], pos_m: [0, 0.02986, 0.00475], color: body}

connector:                       # PLACEHOLDER: replace with Atech module datasheet
  pos_m: [0, 0, 0]
  rpy_deg: [0, 0, 0]

physics_material:                # PLACEHOLDER: replace with Atech module datasheet
  static_friction: 0.5
  dynamic_friction: 0.4
  restitution: 0.1

semantic:
  # Wikidata Q-codes (SimReady SL.003), checked on wikidata.org.
  wikidata_qcode: [Q83341, Q327065]   # liquid-crystal display, display device
  class: [display, output]

placeholders: [mass_kg, colors, connector, physics_material]
