# Simulation data for the Atech `distance_sensor` module, read by `atech.sim`
# (`atech sim-assets`). Frames and every field: src/atech/docs/sim_assets.md.
# Asset frame: metres, origin at the centre of the bottom (mounting) face,
# +z out of the top face, +x along the long side.
#
# Box sizes are the bounds of Atech's production CAD (atechdotdev/atech-module-renders
# v1.5, glb_plain/distance-sensor.glb, converted to +z up). The CAD footprint is centred
# 0.15 mm toward -x; the boxes ignore that. `atech sim-assets --meshes/--fetch`
# uses that CAD for the visuals. Atech has not published masses: the mass, colours,
# connector, physics material and device frames are guesses, marked PLACEHOLDER.
#
# Sensor: ST VL53L5CX 8x8 multizone time-of-flight ranging sensor.
schema: 1

size_m: [0.0195, 0.0195, 0.00954]  # CAD: atech-module-renders v1.5 glb_plain/distance-sensor.glb bounds
mass_kg: 0.008                  # PLACEHOLDER: replace with Atech module datasheet

colors:                          # PLACEHOLDER: replace with Atech module datasheet
  body: [0.12, 0.13, 0.15, 1]
  black: [0.03, 0.03, 0.03, 1]

connector:                       # PLACEHOLDER: replace with Atech module datasheet
  # Mates with the board's port frame: centre of the bottom face.
  pos_m: [0, 0, 0]
  rpy_deg: [0, 0, 0]

physics_material:                # PLACEHOLDER: replace with Atech module datasheet
  static_friction: 0.5
  dynamic_friction: 0.4
  restitution: 0.1

sensor:
  type: tof_multizone
  chip: VL53L5CX
  frame:                          # boresight = +z, on the window   # PLACEHOLDER: replace with Atech module datasheet
    pos_m: [0, 0, 0.00954]
    rpy_deg: [0, 0, 0]
  zones: [8, 8]                   # catalog: 8x8 grid, 64 zones
  max_range_m: 4.0                # catalog: up to ~4000 mm
  min_range_m: 0.02               # verify against ST VL53L5CX datasheet (DS13754)
  fov_deg: [45, 45]               # verify against ST VL53L5CX datasheet (DS13754): 45 deg square, 63 deg diagonal
  rate_hz: 15                     # catalog: the driver ranges at 15 Hz
  no_target_mm: 32767             # catalog: getMinDistance() sentinel when nothing is in range

semantic:
  # Wikidata Q-codes (SimReady SL.003), checked on wikidata.org.
  wikidata_qcode: [Q1643652, Q1746063, Q167676]   # rangefinder, time-of-flight camera, sensor
  class: [distance_sensor, sensor]

# Fields above that are guesses, not Atech data (exported as atech:placeholders).
placeholders: [mass_kg, colors, connector, physics_material, sensor.frame]
