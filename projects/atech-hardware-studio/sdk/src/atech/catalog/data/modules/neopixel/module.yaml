id: neopixel
name: "NeoPixel 3x3 Grid"
display_name: "Light Grid"
category: led
interface: gpio
size: 1
description: |
  3x3 grid of WS2812B / SK6812 LEDs. Drives both Line A (RGB) and Line B
  (RGBW) so the same driver works for both module revisions. Accepts a
  'pixel' action ({index, r, g, b}) and a 'fill' action ({r, g, b}).

driver:
  header: neopixel.h
  source: neopixel.cpp
  class_name: NeoPixelGrid

templates:
  globals: |
    NeoPixelGrid {{ instance }}({{ pin_a }}, {{ pin_b }});
  setup: |
    {{ instance }}.begin();
  loop: ""

actions:
  - key: "{{ instance }}_fill"
    value_type: json
    description: 'Object {"r": 0-255, "g": 0-255, "b": 0-255} sets every LED to that colour.'
    handler: |
      {{ instance }}.setAll(atechNum(value, "r", 0), atechNum(value, "g", 0), atechNum(value, "b", 0));
      {{ instance }}.show();
  - key: "{{ instance }}_pixel"
    value_type: json
    description: 'Object {"index": 0-8, "r": ..., "g": ..., "b": ...} sets one LED.'
    handler: |
      {{ instance }}.setPixel(atechNum(value, "index", 0), atechNum(value, "r", 0), atechNum(value, "g", 0), atechNum(value, "b", 0));
      {{ instance }}.show();
  - key: "{{ instance }}_clear"
    value_type: "null"
    description: "Turn every LED off."
    handler: |
      {{ instance }}.clear();
      {{ instance }}.show();

events: []
# Pinned: a new library release changes the firmware with no change here (Adafruit
# ST7735 1.12.0 + GFX 1.13.0, Oct 2026: the TFT drew nothing on esp32sim). Bump on purpose,
# after `ATECH_COMPILE_TEST=1 pytest -m integration` and a real board.
lib_deps:
  - "adafruit/Adafruit NeoPixel@1.15.5"

usage: |
  // Public API of NeoPixelGrid — the instance is `{{ instance }}`.
  // 3x3 grid (9 LEDs). Always call show() after staging colors.
  // Indices 0-8, or row/col 0-2. Brightness is capped at 20% (51/255) by default.
  {{ instance }}.setAll(255, 0, 0);                   // every LED red
  {{ instance }}.setPixel(4, 0, 255, 0);              // centre LED green
  {{ instance }}.setPixelXY(0, 2, 0, 0, 255);         // top-right blue
  {{ instance }}.setRow(1, 80, 80, 80);               // middle row dim white
  {{ instance }}.setColumn(0, 0, 0, 0);               // left column off
  {{ instance }}.clear();                             // stage all-off
  {{ instance }}.show();                              // push to LEDs (do this!)
  {{ instance }}.setBrightness(30);                   // up to the cap (51 by default)
  {{ instance }}.setBrightnessCap(255);               // only when a brighter grid is wanted
  // The newer RGBW grid has a white LED per pixel; the older RGB grid shows r,g,b.
  {{ instance }}.setPixelRGBW(4, 0, 0, 0, 255);       // centre pure white
  {{ instance }}.setAllRGBW(0, 0, 0, 40);


feedback_output: grid
