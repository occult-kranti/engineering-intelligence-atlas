# Simulation data for the Atech `8port` board, read by `atech.sim`
# (`atech sim-assets --board`). Frames and every field: src/atech/docs/sim_assets.md.
# Asset frame: metres, origin at the centre of the bottom face, +z out of the top
# (front) face. A port frame is where a module's connector frame goes: +z out of the
# face, +y toward the module's outer face. Port ids and which are reserved come from
# boards/8port.yaml.
#
# The box sizes are the bounds of Atech's CAD of this board, "Node 8 Position
# Motherboard" (the frontend's public/models/6portboard.obj, converted to
# motherboard-8port.glb by docs/hardware/obj_to_release_glb.py; not in the CAD
# release yet): a 40 x 120 mm PCB (top at 4.2 mm) in a 44.6 x 124.5 mm steel frame,
# and a bridge across the middle up to 11.3 mm. Its eight sockets sit in two columns
# 14 mm apart, in rows 20 and 40 mm either side of the centre: the layout of
# boards/8port.yaml (right column 1, 2, gap, 3, 4 from the top; left column 5,
# Restart, gap, 7, USB-C). Port frames: 19.5 mm modules in 20 mm cells, each module's
# outer face away from the centre line, seated 0.5 mm above the PCB as on frame-2
# (14port). That placement is not an Atech datasheet, so `ports` stays a PLACEHOLDER.
# Without the GLB in the mesh folder, `atech sim-assets --meshes` draws a derived model.
schema: 1

size_m: [0.0446, 0.1245, 0.0043]  # CAD: motherboard-8port.glb, the frame and PCB (the bridge is a part)
mass_kg: 0.03                  # PLACEHOLDER: replace with Atech board datasheet

colors:                          # PLACEHOLDER: replace with Atech board datasheet
  body: [0.93, 0.93, 0.91, 1]
  port: [0.2, 0.2, 0.22, 1]
  connector: [0.75, 0.75, 0.78, 1]
  accent: [0.95, 0.45, 0.1, 1]

parts:                           # bridge: CAD bounds; port plates (at the seat), Restart, USB-C: PLACEHOLDER
  - {name: bridge, size_m: [0.0446, 0.019, 0.0105], pos_m: [0, 0, 0.00605], color: body}   # CAD: the bridge across the middle
  - {name: port_1_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.01, 0.040, 0.0049], color: port}
  - {name: port_2_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.01, 0.020, 0.0049], color: port}
  - {name: port_3_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.01, -0.020, 0.0049], color: port}
  - {name: port_4_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.01, -0.040, 0.0049], color: port}
  - {name: port_5_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [-0.01, 0.040, 0.0049], color: port}
  - {name: port_7_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [-0.01, -0.020, 0.0049], color: port}
  - {name: reset_button, size_m: [0.006, 0.006, 0.002], pos_m: [-0.01, 0.02, 0.0052], color: accent}
  - {name: usb_c, size_m: [0.009, 0.0035, 0.0032], pos_m: [-0.01, -0.04, 0.0058], color: connector}

connector:                       # PLACEHOLDER: replace with Atech board datasheet
  pos_m: [0, 0, 0]
  rpy_deg: [0, 0, 0]

physics_material:                # PLACEHOLDER: replace with Atech board datasheet
  static_friction: 0.5
  dynamic_friction: 0.4
  restitution: 0.1

ports:                           # PLACEHOLDER: replace with Atech board datasheet
  port_1: {pos_m: [0.01, 0.040, 0.0047], rpy_deg: [0, 0, -90]}
  port_2: {pos_m: [0.01, 0.020, 0.0047], rpy_deg: [0, 0, -90]}
  port_3: {pos_m: [0.01, -0.020, 0.0047], rpy_deg: [0, 0, -90]}
  port_4: {pos_m: [0.01, -0.040, 0.0047], rpy_deg: [0, 0, -90]}
  port_5: {pos_m: [-0.01, 0.040, 0.0047], rpy_deg: [0, 0, 90]}
  port_6: {pos_m: [-0.01, 0.020, 0.0047], rpy_deg: [0, 0, 90]}
  port_7: {pos_m: [-0.01, -0.020, 0.0047], rpy_deg: [0, 0, 90]}
  port_8: {pos_m: [-0.01, -0.040, 0.0047], rpy_deg: [0, 0, 90]}

semantic:
  # Wikidata Q-codes (SimReady SL.003), checked on wikidata.org.
  wikidata_qcode: [Q4321, Q173350]   # motherboard, printed circuit board
  class: [motherboard]

# Fields above that are guesses, not Atech data (exported as atech:placeholders).
placeholders: [mass_kg, colors, parts, connector, physics_material, ports]
