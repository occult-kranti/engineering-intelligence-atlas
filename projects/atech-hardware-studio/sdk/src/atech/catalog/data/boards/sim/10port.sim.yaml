# Simulation data for the Atech `10port` board, read by `atech.sim`
# (`atech sim-assets --board`). Frames and every field: src/atech/docs/sim_assets.md.
# Asset frame: metres, origin at the centre of the bottom face, +z out of the top
# (front) face. A port frame is where a module's connector frame goes: +z out of the
# face, +y toward the module's outer face. Port ids and which are reserved come from
# boards/10port.yaml.
#
# Size and port positions are measured from Atech's production CAD
# (atechdotdev/atech-module-renders v1.5 to v1.7, glb_plain/motherboard-10port.glb, +z up):
# 40 x 60 x 7.11 mm, the PCB from z 3.11 to 4.71 mm. The front face has six socket
# housings in two columns (centres x = +-5.78 mm, y = 0 and +-20 mm, opening along x),
# the back face four larger ones (x = +-8.92 mm, y = +-16 mm, opening along y).
# A port frame sits 3.52 mm outward of its housing's centre, as on frame-2 (14port),
# 0.5 mm off the PCB (z 5.21 mm front, 2.61 mm back).
# An earlier version of this file laid the board out as a 200 x 40 mm bar on a 32 mm
# grid; that did not match the CAD.
#
# WHICH socket is which port is NOT in the CAD. The numbering below is a guess that
# keeps boards/10port.yaml's adjacent pairs (1-2, 2-3, 4-5, 5-6) neighbours in one
# column: front left column 1, 2, 3 from +y down, right column 4, 5, 6 from -y up;
# back 7, 8 at +y and 9, USB-C (10) at -y. Pair 3-4 then spans the two columns, which
# a two-port module cannot do; that matches the OPEN note in boards/10port.yaml.
# Verify on a board before relying on it.
schema: 1

size_m: [0.04, 0.06, 0.00711]   # CAD: atech-module-renders v1.5 glb_plain/motherboard-10port.glb bounds (same in v1.7)
mass_kg: 0.03                  # PLACEHOLDER: replace with Atech board datasheet

colors:                          # PLACEHOLDER: replace with Atech board datasheet
  body: [0.93, 0.93, 0.91, 1]
  port: [0.2, 0.2, 0.22, 1]
  connector: [0.75, 0.75, 0.78, 1]

parts:                           # PLACEHOLDER: one 19.5 mm port cell per port, as on 14port
  - {name: port_1_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [-0.00930, 0.0200, 0.00541], color: port}
  - {name: port_2_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [-0.00930, 0.0000, 0.00541], color: port}
  - {name: port_3_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [-0.00930, -0.0200, 0.00541], color: port}
  - {name: port_4_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.00930, -0.0200, 0.00541], color: port}
  - {name: port_5_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.00930, 0.0000, 0.00541], color: port}
  - {name: port_6_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.00930, 0.0200, 0.00541], color: port}
  - {name: port_7_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [-0.00892, 0.0196, 0.00241], color: port}
  - {name: port_8_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.00892, 0.0196, 0.00241], color: port}
  - {name: port_9_slot, size_m: [0.0195, 0.0195, 0.0004], pos_m: [0.00892, -0.0196, 0.00241], color: port}
  - {name: usb_c, size_m: [0.009, 0.0035, 0.0032], pos_m: [-0.00892, -0.0280, 0.0016], color: connector}

connector:                       # PLACEHOLDER: replace with Atech board datasheet
  # Where the board itself mounts (e.g. on a robot base): centre of the bottom face.
  pos_m: [0, 0, 0]
  rpy_deg: [0, 0, 0]

physics_material:                # PLACEHOLDER: replace with Atech board datasheet
  static_friction: 0.5
  dynamic_friction: 0.4
  restitution: 0.1

ports:                           # positions from the CAD; numbering PLACEHOLDER (see the header)
  port_1: {pos_m: [-0.00930, 0.0200, 0.00521], rpy_deg: [0, 0, 90]}
  port_2: {pos_m: [-0.00930, 0.0000, 0.00521], rpy_deg: [0, 0, 90]}
  port_3: {pos_m: [-0.00930, -0.0200, 0.00521], rpy_deg: [0, 0, 90]}
  port_4: {pos_m: [0.00930, -0.0200, 0.00521], rpy_deg: [0, 0, -90]}
  port_5: {pos_m: [0.00930, 0.0000, 0.00521], rpy_deg: [0, 0, -90]}
  port_6: {pos_m: [0.00930, 0.0200, 0.00521], rpy_deg: [0, 0, -90]}
  port_7: {pos_m: [-0.00892, 0.0196, 0.00261], rpy_deg: [180, 0, 180], face: bottom}
  port_8: {pos_m: [0.00892, 0.0196, 0.00261], rpy_deg: [180, 0, 180], face: bottom}
  port_9: {pos_m: [0.00892, -0.0196, 0.00261], rpy_deg: [180, 0, 0], face: bottom}
  port_10: {pos_m: [-0.00892, -0.0196, 0.00261], rpy_deg: [180, 0, 0], face: bottom}

semantic:
  # Wikidata Q-codes (SimReady SL.003), checked on wikidata.org.
  wikidata_qcode: [Q4321, Q173350]   # motherboard, printed circuit board
  class: [motherboard]

# Fields above that are guesses, not Atech data (exported as atech:placeholders).
placeholders: [mass_kg, colors, parts, connector, physics_material, ports]
