[project]
name = "atech"
version = "1.0.0a12"
description = "Open-source Python SDK for Atech motherboards: catalog, codegen, build, flash, and runtime control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atech" }]
keywords = [
    "atech",
    "esp32",
    "hardware",
    "firmware",
    "iot",
    "serial",
    "platformio",
    "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "platformio>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# `atech sim-assets`: usd-core for --format usd (SimReady USD), trimesh to read
# Atech's CAD (--meshes / --fetch). Box-only MJCF and URDF need nothing extra.
sim = [
    "usd-core>=24.11",
    "trimesh>=4.0",
]

[project.scripts]
atech = "atech.cli:main"

[project.urls]
Homepage = "https://atech.dev"
Repository = "https://github.com/atechdotdev/python-sdk"
Documentation = "https://github.com/atechdotdev/python-sdk#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atech"]

[tool.hatch.build.targets.sdist]
include = [
    "src/atech",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: real end-to-end compile via PlatformIO (slow, opt-in; set ATECH_COMPILE_TEST=1)",
]
