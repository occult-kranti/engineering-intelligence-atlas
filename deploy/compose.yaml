name: daftar

services:
  runtime:
    image: daftar-runtime:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${DAFTAR_NODE_IMAGE:-node:24-bookworm-slim}
        RUST_IMAGE: ${DAFTAR_RUST_IMAGE:-rust:1.100.0-bookworm}
    init: true
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    ports:
      # No public owner-token service: reach the host over SSH or a private tunnel.
      - "127.0.0.1:8788:8788"
    environment:
      DAFTAR_HOST: "0.0.0.0"
      DAFTAR_ALLOW_CONTAINER_BIND: "1"
      DAFTAR_ALLOWED_HOSTS: "127.0.0.1:8788,localhost:8788,[::1]:8788"
      DAFTAR_PORT: "8788"
      DAFTAR_DATA_DIR: /var/lib/daftar
      DAFTAR_REPO_ROOT: /app
      DAFTAR_CORE_BINARY: /app/native-core/target/release/atlas-core
      DAFTAR_CONTROL_TOKEN_FILE: /run/secrets/control-token
      DAFTAR_CONCURRENCY: ${DAFTAR_CONCURRENCY:-2}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      DAFTAR_CLOUD_SYNC: ${DAFTAR_CLOUD_SYNC:-0}
      DAFTAR_CLOUD_URL: ${DAFTAR_CLOUD_URL:-}
      DAFTAR_CLOUD_PAIRING_FILE: ${DAFTAR_CLOUD_PAIRING_FILE:-}
      DAFTAR_CLOUD_ENCRYPTION_KEY_FILE: ${DAFTAR_CLOUD_ENCRYPTION_KEY_FILE:-}
      DAFTAR_CLOUD_SYNC_INTERVAL_SECONDS: ${DAFTAR_CLOUD_SYNC_INTERVAL_SECONDS:-60}
      DAFTAR_CLOUD_ALLOW_KNOWN_SCHEMA_DEFAULTS: ${DAFTAR_CLOUD_ALLOW_KNOWN_SCHEMA_DEFAULTS:-0}
    volumes:
      - runtime_data:/var/lib/daftar
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    healthcheck:
      test: ["CMD", "node", "/app/deploy/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  runtime_data:
    name: ${DAFTAR_VOLUME_NAME:-daftar_runtime_data}
