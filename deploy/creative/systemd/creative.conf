[Service]
Environment=DAFTAR_CREATIVE_CONFIG_FILE=/etc/daftar/creative-tools.json
Environment=XDG_CACHE_HOME=/var/lib/daftar-creative/cache
Environment=XDG_CONFIG_HOME=/var/lib/daftar-creative/config
Environment=PYTHONDONTWRITEBYTECODE=1
StateDirectory=daftar-creative
ReadWritePaths=/var/lib/daftar-creative
MemoryHigh=14G
MemoryMax=16G
CPUQuota=400%
TasksMax=512
TimeoutStopSec=45
KillMode=control-group
# CPU rendering and inspections do not need host device access.
PrivateDevices=true
