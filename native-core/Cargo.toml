[package]
name = "atlas-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Bounded local company state and repository inventory for Engineering Intelligence Atlas"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.0", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

