<!--
Documented-procedure exercise: ad quadratum (rotation of squares) after Mathes Roriczer, Buechlein von der Fialen Gerechtigkeit (Regensburg, 1486); facsimile/transcription in Shelby, Gothic Design Techniques (1977). Steps: (1) draw the outer square; (2) mark midpoints of its sides; (3) join the midpoints to form the rotated inner square; (4) repeat. Each rotated square's area is half its predecessor; vertices are computed geometrically (exact closure by construction, not measured from a monument).
MODERN EXERCISE - generated teaching artifact; not a historical artifact and not a reconstruction claim.
