name: Build and deploy static atlas

on:
  push:
    branches: [main]
    paths:
      - 'site-source/**'
      - 'desktop-shell/src/renderer/**'
      - 'company/**'
      - 'projects/architecture-library/**'
      - 'projects/research-memory-atlas/**'
      - 'projects/design-backgrounds/**'
      - 'desktop-shell/src/shared/graphMemory.ts'
      - 'desktop-shell/src/shared/donnaBrain.ts'
      - 'integrations/heritage-assets/**'
      - 'integrations/godot-heritage-review/**'
      - 'integrations/opencode-game-studios/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site-source/package-lock.json
      - name: Install locked web dependencies
        run: npm --prefix site-source ci
      - name: Check source and migration integrity
        run: |
          npm --prefix site-source run check
          npm --prefix site-source run check:migrations
          node projects/architecture-library/validate.mjs
          node scripts/validate-research-memory.mjs
          node --test projects/research-memory-atlas/tests/*.test.mjs
      - name: Build portable static atlas from source
        run: node scripts/build-static.mjs
      - name: Verify model and game resource integrity before deployment
        run: |
          npm --prefix integrations/heritage-assets ci --ignore-scripts --no-audit --no-fund
          node scripts/check-game-heritage.mjs
      - name: Install locked DOM test dependency without native install scripts
        run: npm --prefix desktop-shell ci --ignore-scripts --no-audit --no-fund
      - name: Install browser for Pages smoke test
        working-directory: site-source
        run: npx playwright install --with-deps chromium
      - name: Verify Pages subpath and offline reload
        run: node scripts/smoke-static.mjs
      - name: Verify architecture library and model downloads
        run: |
          browser_gate_status=0
          node scripts/smoke-architecture-library.mjs || browser_gate_status=1
          node scripts/smoke-heritage-viewer.mjs || browser_gate_status=1
          node scripts/smoke-research-memory.mjs || browser_gate_status=1
          node scripts/smoke-design-backgrounds.mjs --browser || browser_gate_status=1
          node desktop-shell/scripts/copy-renderer-assets.mjs || browser_gate_status=1
          node desktop-shell/tests/donna-brain-browser.mjs || browser_gate_status=1
          exit "$browser_gate_status"
      - name: Save every web and desktop workspace screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            site-source/.work/ui-screenshots
            site-source/.work/architecture-ui
            site-source/.work/heritage-ui
            site-source/.work/research-memory-ui
            projects/design-backgrounds/verification
            desktop-shell/.work/donna-brain-ui
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - name: Upload verified client files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
