name: Verify source and shells

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site-source/package-lock.json
      - run: npm ci
        working-directory: site-source
      - name: Check, build and test without live service credentials
        working-directory: site-source
        run: |
          npm run check
          npm run check:migrations
          npm run build
          npm test
      - name: Build the public renderer for release verification
        run: node scripts/build-static.mjs
      - name: Verify architecture sources, model hashes and bounded importers
        run: |
          node projects/architecture-library/validate.mjs
          node --test projects/architecture-library/tests/*.test.mjs scripts/architecture-library-assets.test.mjs scripts/static-build-lib.test.mjs
          python3 -m unittest discover -s projects/architecture-library/samples -p 'test_*.py' -v
          python3 -m unittest discover -s projects/architecture-library/geospatial/tests -p 'test_*.py' -v
      - name: Install browser for the release gate
        working-directory: site-source
        run: npx playwright install --with-deps chromium
      - name: Verify all workspace panels before publishing a release
        run: node scripts/smoke-static.mjs
      - name: Verify architecture library on desktop and mobile
        run: node scripts/smoke-architecture-library.mjs
      - name: Retain architecture library browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-library-ui
          path: site-source/.work/architecture-ui
          if-no-files-found: warn
      - name: Retain release browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-screenshots
          path: site-source/.work/ui-screenshots
          if-no-files-found: warn

  release-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release checksum rules with disposable temp files
        run: node scripts/release-checksums.test.mjs

  headless:
    uses: ./.github/workflows/headless-runtime.yml

  creative-tools:
    uses: ./.github/workflows/creative-tools.yml

  mysql-connectors:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
          MYSQL_DATABASE: atlas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:isolated-ci-password@127.0.0.1:3306/atlas_test
      RUN_DATABASE_TESTS: '1'
      RUN_STORAGE_TESTS: '0'
      RUN_LIVE_AI_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site-source/package-lock.json
      - run: npm ci
        working-directory: site-source
      - name: Apply and seed schema in disposable MySQL
        working-directory: site-source
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:migrate
      - name: Verify owner scoping and mocked connectors against real MySQL
        working-directory: site-source
        run: npx vitest run api/integrations/router.test.ts api/integrations/provider-vault.test.ts

  desktop:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json
      - name: Select Rust stable
        run: rustup default stable
      - name: Verify local portfolio preparation and backup tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify native core
        run: cargo test --locked --manifest-path native-core/Cargo.toml
      - run: npm ci
        working-directory: desktop-shell
      - name: Build native helper, shell and atlas
        working-directory: desktop-shell
        run: |
          npm run build:native
          npm run build
          npm run sync-atlas -- --src ../docs
          npm test
          npm run test:renderer
          node ../scripts/smoke-office.mjs
          node ../scripts/smoke-architecture-dom.mjs
          node --test ../tools/atlas-mcp.test.mjs
          node --test ../scripts/test-company-kits.mjs ../scripts/reconcile-company-hierarchy.test.mjs
      - name: Package Linux desktop
        working-directory: desktop-shell
        run: npm run package:linux
      - name: Install the browser test driver for the packaged application
        run: npm --prefix site-source ci
      - name: Launch the packaged Electron app and exercise its real Rust core
        env:
          ATLAS_CI_NO_SANDBOX: '1'
        run: xvfb-run -a node scripts/smoke-packaged-desktop.mjs
      - name: Retain packaged desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-ui
          path: desktop-shell/.work/packaged-ui
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop-shell/release/*.AppImage

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json
      - name: Select Rust stable MSVC x64
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native core
        run: cargo test --locked --manifest-path native-core/Cargo.toml
      - run: npm ci
        working-directory: desktop-shell
      - name: Build native helper
        working-directory: desktop-shell
        run: npm run build:native
      - name: Typecheck
        working-directory: desktop-shell
        run: npm run typecheck
      - name: Desktop unit tests
        working-directory: desktop-shell
        run: npm test
      - name: Renderer tests
        working-directory: desktop-shell
        run: npm run test:renderer
      - name: Sync atlas
        working-directory: desktop-shell
        run: npm run sync-atlas -- --src ../docs
      - name: Package Windows x64 NSIS and ZIP
        working-directory: desktop-shell
        run: npm run package:win
      - name: Install the browser test driver for the packaged application
        run: npm --prefix site-source ci
      - name: Launch the packaged Windows app and exercise its real Rust core
        shell: pwsh
        env:
          ATLAS_PACKAGED_SMOKE_OUT: ${{ github.workspace }}\desktop-shell\.work\packaged-ui-windows
        run: |
          $env:ATLAS_PACKAGED_BINARY = Join-Path $PWD 'desktop-shell/release/win-unpacked/Daftar.exe'
          node scripts/smoke-packaged-desktop.mjs
      - name: Retain packaged Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-ui-windows
          path: desktop-shell/.work/packaged-ui-windows
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop-shell/release/daftar-desktop-*-windows-x64.exe
            desktop-shell/release/daftar-desktop-*-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-shell/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy tools package is no longer served; cmdline-tools are
          # installed by the action itself. The target SDK is installed below.
          packages: 'platform-tools'
      - name: Install Android SDK target
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
        working-directory: android-shell
      - name: Test launcher and sync the checked-in atlas
        working-directory: android-shell
        run: |
          npm test
          npm run sync:atlas -- --src ../docs
          npx cap sync android
      - name: JVM tests and debug APK
        working-directory: android-shell/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android-shell/android/app/build/outputs/apk/debug/app-debug.apk

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cloud-workspace/package-lock.json
            desktop-shell/package-lock.json
      - name: Install desktop-shell dependencies without the Electron binary
        working-directory: desktop-shell
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build the shared desktop renderer
        working-directory: desktop-shell
        run: npm run build
      - run: npm ci
        working-directory: cloud-workspace
      - name: Sync the real shared renderer into the cloud workspace
        working-directory: cloud-workspace
        run: node scripts/sync-desktop.mjs "$GITHUB_WORKSPACE"
      - name: Verify owner access, atomic budgets, revisions, device claims and queue recovery
        working-directory: cloud-workspace
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test tests/*.test.mjs
          npm run build
      - name: Install the browser test driver
        run: npm ci --prefix site-source
      - name: Install Chromium for the cloud interface gate
        working-directory: site-source
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and narrow cloud interfaces with explicit synthetic API fixtures
        timeout-minutes: 5
        run: node scripts/smoke-cloud-ui.mjs
      - name: Retain cloud interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ui-screenshots
          path: cloud-workspace/outputs/ui-smoke/
          if-no-files-found: warn

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - name: Test and package VS Code extension
        working-directory: vscode-extension
        run: |
          npm run check
          npm test
          npm run package
      - name: Activate the installed VSIX in an isolated VS Code window
        working-directory: vscode-extension
        timeout-minutes: 5
        run: xvfb-run -a npm run test:installed
      - name: Retain installed editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-installed-smoke
          path: vscode-extension/.work/installed-smoke/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix

  design-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design-tools/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: design-tools
      - name: Verify bounded OpenPencil handoff with no network or provider calls
        working-directory: design-tools
        run: |
          npm run check
          npm test
          npm run smoke
      - name: Retain design interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-handoff
          path: design-tools/.work/
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: [web, release-checksums, headless, creative-tools, mysql-connectors, desktop, desktop-windows, android, cloud, editor, design-tools]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-debug
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release/editor
      - name: Publish a new verified version without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(node -p "require('./desktop-shell/package.json').version")
          if gh release view "v${release_version}" >/dev/null 2>&1; then
            echo "Version already published; existing release is preserved."
          else
            node scripts/release-checksums.test.mjs
            node scripts/release-checksums.mjs release release/SHA256SUMS
            gh release create "v${release_version}" release/*.AppImage release/windows/*.exe release/windows/*.zip release/android/*.apk release/editor/*.vsix release/SHA256SUMS --target "$GITHUB_SHA" --title "Daftar ${release_version} — command studio" --notes-file project/RELEASE_NOTES.md
          fi
